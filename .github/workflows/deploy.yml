name: Validate TurtleBlock AI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turtleblockai-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "1237f978938188ed96dc859fdd2d40d0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Next Edge research contract
        run: npm run validate:next-edge

      - name: Validate learner-authored verification contract
        run: npm run validate:learner-verification

      - name: Validate World Evidence Envelope
        run: npm run validate:world-evidence

      - name: Validate Selective Attention Envelope
        run: npm run validate:selective-attention

      - name: Validate Plural Foreground Envelope
        run: npm run validate:plural-foreground

      - name: Validate Build Log cross-connections
        run: npm run validate:build-log-connections

      - name: Validate Terraria TRY IT contract
        run: npm run validate:terraria-try

      - name: Audit repository-to-D1 reconciliation candidates
        run: npm run audit:d1-coverage

      - name: Confirm Cloudflare deployment token
        shell: bash
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Apply library schema and seed to live D1
        run: npx wrangler d1 execute turtleblockai --remote --file=./migrations/0010_library_sources.sql

      - name: Verify live D1 library rows
        run: |
          result="$(npx wrangler d1 execute turtleblockai --remote --command="SELECT COUNT(*) AS count FROM library_sources;" --json)"
          echo "$result"
          echo "$result" | grep -Eq '"count"[[:space:]]*:[[:space:]]*11'

      - name: Deployment note
        run: echo "Production deployment is handled by the connected Cloudflare Workers Builds GitHub integration."
