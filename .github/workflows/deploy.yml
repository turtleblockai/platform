name: Validate TurtleBlock AI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turtleblockai-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Next Edge research contract
        run: npm run validate:next-edge

      - name: Validate learner-authored verification contract
        run: npm run validate:learner-verification

      - name: Validate World Evidence Envelope
        run: npm run validate:world-evidence

      - name: Validate Selective Attention Envelope
        run: npm run validate:selective-attention

      - name: Validate Plural Foreground Envelope
        run: npm run validate:plural-foreground

      - name: Validate Human Perturbation Translation Envelope
        run: npm run validate:human-perturbation

      - name: Validate Branch Experience Comparison Envelope
        run: npm run validate:branch-experience

      - name: Validate Cross-Branch Perturbation Envelope
        run: npm run validate:cross-branch-perturbation

      - name: Validate Initiative Authority Envelope
        run: npm run validate:initiative-authority

      - name: Validate Initiative Authority session boundary
        run: npm run validate:initiative-authority-session-boundary

      - name: Validate Initiative Authority scope conflicts
        run: npm run validate:initiative-authority-scope-conflict

      - name: Validate Initiative Authority temporary hold
        run: npm run validate:initiative-authority-temporary-hold

      - name: Validate conflict explanation neutrality
        run: npm run validate:conflict-explanation

      - name: Validate retained-context resurfacing authority
        run: npm run validate:resurfacing-authority

      - name: Validate Discord Turtle conversation contract
        run: npm run validate:discord-conversation

      - name: Validate Turtle runtime secret contract
        run: npm run validate:runtime-secrets

      - name: Validate Build Log cross-connections
        run: npm run validate:build-log-connections

      - name: Validate Terraria TRY IT contract
        run: npm run validate:terraria-try

      - name: Audit repository-to-D1 reconciliation candidates
        run: npm run audit:d1-coverage

      - name: Deployment note
        run: echo "Production deployment is handled by the connected Cloudflare Workers Builds GitHub integration."
