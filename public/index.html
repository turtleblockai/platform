<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TurtleBlock AI</title>
  <meta name="description" content="Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b0f0d;--panel:#0f1511;--card:#101712;--border:#26382b;--border2:#36513c;--text:#eef7f0;--muted:#b9c9bc;--soft:#8fae95;--accent:#9fe0ad;--dim:#607565}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text)}a{color:var(--accent)}button,input,textarea{font:inherit}
    main{width:min(1160px,calc(100% - 2rem));margin:0 auto;padding:54px 1rem 80px}
    .shell{display:grid;grid-template-columns:minmax(0,720px) 360px;gap:40px;justify-content:center;align-items:start}
    .content{min-width:0;width:100%;min-height:700px}.panel{width:360px;border:1px solid var(--border);border-radius:18px;background:var(--panel);padding:1rem;position:sticky;top:32px}
    .markrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;min-height:94px}.mark{font-size:4.75rem;line-height:1;letter-spacing:-.14em;white-space:nowrap}.mark .page{display:inline-block;margin-left:.2em;font-size:.58em;letter-spacing:0;vertical-align:.13em}
    h1{margin:.35rem 0 .7rem;font-size:clamp(3rem,6.5vw,5.65rem);letter-spacing:-.055em;line-height:.96}h2{margin:2rem 0 .55rem;font-size:1.45rem}h3{margin:0 0 .35rem}p,li{color:var(--muted);line-height:1.6}.lede{margin:0;color:var(--muted);font-size:clamp(1.05rem,2vw,1.42rem);line-height:1.5}.creator{margin-top:1rem;color:var(--soft)}.creator a{font-weight:700;text-decoration:none}.creator a:hover{text-decoration:underline}
    .actions,.pills{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.25rem}.primary,.secondary,.pill{display:inline-block;padding:.8rem 1.05rem;border-radius:999px;text-decoration:none;font-weight:750}.primary{background:var(--accent);color:var(--bg);border:0;cursor:pointer}.secondary,.pill{border:1px solid var(--border2);color:var(--text);background:transparent;cursor:pointer}.pill{padding:.6rem .85rem;font-size:.92rem}
    .panel h2{margin:.2rem 0 .9rem;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.navcard{display:block;text-align:left;padding:1rem;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer;height:132px}.navcard:hover,.navcard.active{border-color:#6fa87a;background:#142019}.navcard strong{display:block;margin-bottom:.25rem;font-size:1rem}.navcard span{font-size:.86rem;line-height:1.35;color:var(--soft)}
    .status{margin-top:.8rem;padding:.8rem 1rem;border-radius:12px;background:var(--bg);color:#78947e;font-size:.86rem}.foot{margin-top:1.4rem;color:var(--dim);font-size:.82rem}
    .loop,.callout,.codebox{margin:1.2rem 0;padding:1rem 1.1rem;border:1px solid var(--border);border-radius:14px;background:var(--card)}.loop,.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8eadb;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin:1.2rem 0}.smallcard{padding:1rem;border:1px solid var(--border);border-radius:12px;background:var(--card)}.smallcard p{margin:.35rem 0 0;font-size:.94rem}.stage{padding:.85rem 1rem;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:.7rem 0}.stage strong{display:block;margin-bottom:.2rem}.done{color:var(--accent)}
    textarea{width:100%;min-height:155px;resize:vertical;border:1px solid var(--border2);border-radius:12px;background:var(--bg);color:var(--text);padding:1rem;line-height:1.5}.consent{display:flex;gap:.65rem;align-items:flex-start;margin:1rem 0;color:var(--muted);line-height:1.45}.consent input{margin-top:.25rem}.result{margin-top:1rem}.result pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1rem;color:#d8eadb;max-height:320px;overflow:auto}.meta{font-size:.86rem;color:#78947e}.error{color:#ffb0b0}.hidden{display:none!important}.fade{animation:fade .16s ease-out}@keyframes fade{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
    @media(max-width:980px){main{padding-top:28px}.shell{grid-template-columns:1fr}.panel{width:100%;position:static;order:-1}.content{min-height:0}.navgrid{grid-template-columns:repeat(4,1fr)}.navcard{height:92px;padding:.8rem}.navcard span{display:none}}
    @media(max-width:560px){.navgrid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.mark{font-size:3.65rem}.panel{padding:.8rem}.shell{gap:1.2rem}h1{font-size:3.15rem}}
  </style>
</head>
<body>
<main><section class="shell"><section id="content" class="content" aria-live="polite"></section><aside class="panel" aria-label="TurtleBlock sections"><h2>Start here</h2><div class="navgrid">
<button class="navcard" data-route="try"><strong>Try It</strong><span>Test the public WorldSpec interpreter.</span></button>
<button class="navcard" data-route="about"><strong>About</strong><span>The project and why it exists.</span></button>
<button class="navcard" data-route="worldspec"><strong>WorldSpec</strong><span>The emerging language for constructible ideas.</span></button>
<button class="navcard" data-route="research"><strong>Research</strong><span>CTC → STEAMHAMLET → Minecraft → co-active emergence.</span></button>
<button class="navcard" data-route="build"><strong>Build Log</strong><span>Code, milestones, mistakes, and next edges.</span></button>
<button class="navcard" data-route="steamhamlet"><strong>STEAMHAMLET</strong><span>The earlier room of possibilities and source archive.</span></button>
<button class="navcard" data-route="reeducation"><strong>RE/EDUCATION</strong><span>Credentialed practice and school-based R&amp;D.</span></button>
<button class="navcard" data-route="privacy"><strong>Privacy</strong><span>How Playground submissions may be used.</span></button>
</div><div class="status">🐢 Playground v0.1 is live: interpretation first, Minecraft construction next.</div></aside></section></main>
<script>
const content=document.getElementById('content');const nav=[...document.querySelectorAll('.navcard')];
const creator=`<div class="creator">Created and researched by <a href="https://www.google.com/search?q=nayrbgo" target="_blank" rel="noopener noreferrer">@nayrbgo</a> · <a href="https://github.com/nayrbgo" target="_blank" rel="noopener noreferrer">GitHub</a></div>`;
const mark=(icon='🏠')=>`<div class="markrow"><div class="mark" aria-hidden="true">🐢🧱<span class="page">${icon}</span></div></div>`;
const home=`${mark('🏠')}<h1>TurtleBlock AI</h1><p class="lede">Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond.</p>${creator}<div class="actions"><button class="primary" data-go="try">Try It</button><button class="secondary" data-go="about">What is this?</button><button class="secondary" data-go="build">Build log</button></div><div class="foot">A public educational research playground · building the ship while flying the ship.</div>`;
const pages={
home:()=>home,
about:()=>`${mark('❓')}<h1>What is TurtleBlock AI?</h1><p class="lede">A public educational research playground for turning ideas into computational worlds that can be built, inhabited, questioned, broken, revised, and shared.</p><div class="callout"><strong>Building the ship while flying the ship.</strong><p>TurtleBlock AI is both software and inquiry. The platform changes through use, and the process of building it is part of the research.</p></div><h2>Not an AI world vending machine</h2><p>The learner remains the designer and producer. Turtle helps represent, clarify, test, and revise ideas rather than silently replacing them with a finished answer.</p>${creator}`,
worldspec:()=>`${mark('📐')}<h1>WorldSpec</h1><p class="lede">The edition-independent representation layer between a learner's idea, a conversation with Turtle, and a world that can be built, inhabited, tested, reflected upon, and revised.</p><div class="loop">learner intent → dialogue → WorldSpec → build → inhabit → notice → reflect → revise ↺</div><div class="cards"><div class="smallcard"><strong>Schema</strong><p>Objects, relationships, form, function, materials, meaning, constraints, reflection, and history.</p></div><div class="smallcard"><strong>Lexicon</strong><p>Construction, inquiry, social, semantic, reflective, uncertainty, and provenance language.</p></div><div class="smallcard"><strong>Grammar + syntax</strong><p>Rules for direct action, interpretation, questions, negation, contradiction, deixis, comparison, and revision.</p></div></div><h2>Hostile data pass</h2><p>WorldSpec tests ambiguous references, contradictions, questions that must not execute, learner-defined meanings, social disagreement, manual edits, unknown values, and deliberately strange language such as “make the castle more Tuesday.”</p><div class="codebox">SPEECH-ACT + ACTION + TARGET + CHANGE + RELATION + CONSTRAINT + MEANING + EPISTEMIC-STATE + REFLECTION</div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform/tree/main/worldspec" target="_blank">WorldSpec on GitHub</a><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/grammar/syntax.md" target="_blank">Syntax</a><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/tests/hostile-cases.yaml" target="_blank">Hostile cases</a></div>${creator}`,
research:()=>`${mark('🔬')}<h1>Research lineage</h1><p class="lede">TurtleBlock AI is a live implementation space for a longer line of educational research centered on learner agency, inquiry, construction, collaboration, reflection, and computers as environments for thinking.</p><div class="loop">Critical Techno Constructivism → STEAMHAMLET → Minecraft learning environments → co-active emergence → TurtleBlock AI</div><h2>Research as public construction</h2><p>WorldSpec, Turtle, the Minecraft adapters, and the Playground are revised through use. The codebase and website function as both software and research notebook.</p><div class="pills"><a class="pill" href="https://steamhamlet.com" target="_blank">STEAMHAMLET archive</a><button class="pill" data-go="worldspec">WorldSpec</button></div>${creator}`,
build:()=>`${mark('🔧')}<h1>Build Log</h1><p class="lede">The code, mistakes, revisions, research questions, and changing architecture stay visible.</p><div class="stage"><strong class="done">✓ Public platform</strong><p>GitHub organization, Cloudflare deployment, turtleblockai.com, health endpoint, persistent navigation shell, and project pages.</p></div><div class="stage"><strong class="done">✓ WorldSpec v0.1</strong><p>Schema, expanded lexicon, grammar, syntax, hostile cases, example, and deterministic interpreter.</p></div><div class="stage"><strong class="done">✓ Playground v0.1</strong><p>Anonymous browser session IDs, Privacy Notice v0.1, consent versioning, and D1-ready persistence schema.</p></div><div class="stage"><strong>→ Current edge</strong><p>Activate D1 persistence, implement filtering/review states, deepen interpretation, and begin the first Minecraft adapter experiments.</p></div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform" target="_blank">Public repository</a></div>${creator}`,
steamhamlet:()=>`${mark('🌀')}<h1>STEAMHAMLET → TurtleBlock AI</h1><p class="lede">STEAMHAMLET is the earlier room of possibilities behind TurtleBlock AI: a shared environment where ideas and informational objects can be moved, changed, scaled, remixed, juxtaposed, tested, and revised.</p><p>TurtleBlock AI gives that long-running vision an executable playground through conversational agents, WorldSpec, Minecraft, and a public build process.</p><div class="loop">Critical Techno Constructivism → STEAMHAMLET → Minecraft → co-active emergence → TurtleBlock AI</div><div class="pills"><a class="pill" href="https://steamhamlet.com" target="_blank">Open STEAMHAMLET</a><button class="pill" data-go="research">Research lineage</button></div>${creator}`,
reeducation:()=>`${mark('🏫')}<h1>TurtleBlock AI + RE/EDUCATION</h1><p class="lede">TurtleBlock AI is being developed as part of the educational practice, research, and school-building work of <a href="https://reeducationllc.com" target="_blank">RE/EDUCATION</a>.</p><div class="callout"><strong>A school can also be a laboratory.</strong><p>TurtleBlock AI provides a place to design, test, revise, and study new forms of learner-centered computational experience while those experiences are being built.</p></div><h2>Credentialed practice meets research</h2><p>The project connects day-to-day work as a credentialed educator with longer-running doctoral and post-doctoral inquiry into constructivism, constructionism, digital learning environments, Minecraft, machine intelligence, and co-active emergence.</p><div class="pills"><a class="pill" href="https://reeducationllc.com" target="_blank">Visit RE/EDUCATION</a><button class="pill" data-go="research">Research</button></div>${creator}`,
privacy:()=>`${mark('🔐')}<h1>Playground Privacy</h1><p class="lede">TurtleBlock AI is an experimental educational research and development project.</p><h2>What happens to submissions</h2><p>Text submitted through the Playground may be retained and analyzed to operate, evaluate, research, develop, and improve TurtleBlock AI, WorldSpec, related educational tools, and future research or training datasets.</p><h2>Do not submit personal or sensitive information</h2><p>Please do not submit passwords, financial information, medical information, confidential school records, private communications, or information about other people that you do not have permission to share.</p><h2>Review and filtering</h2><p>Before material is incorporated into a research, evaluation, or training dataset, TurtleBlock AI intends to use automated and, where appropriate, human review to identify and remove or exclude personal, sensitive, unsafe, offensive, or irrelevant content. These processes are not perfect.</p><h2>Anonymous sessions</h2><p>The public Playground does not require identification. A random browser session identifier may connect related revisions. TurtleBlock AI does not intentionally store IP addresses in the Playground research dataset.</p><div class="meta">Privacy version 0.1 · August 2026</div>${creator}`,
try:()=>`${mark('🧪')}<h1>Try It</h1><p class="lede">Describe something you want to make, change, test, or understand. Turtle will turn the language into a revisable WorldSpec interpretation.</p><div class="callout"><textarea id="idea" maxlength="4000" placeholder="Example: Make a small village on a hill where the houses share a central garden, but keep the paths irregular and make the entrance feel welcoming."></textarea><label class="consent"><input id="consent" type="checkbox"><span>I understand that my submission may be retained and used for TurtleBlock AI research, evaluation, improvement, and future training/evaluation datasets under <button class="pill" data-go="privacy" type="button">Privacy Notice v0.1</button>. I will not submit personal or sensitive information.</span></label><div class="actions"><button id="submit" class="primary" disabled>Build with Turtle</button><span class="meta">WorldSpec v0.1 · experimental</span></div><div id="result" class="result hidden"><h2>Turtle interpretation</h2><pre id="output"></pre><div id="persist" class="meta"></div></div></div>${creator}`};
function routeFromPath(){const p=location.pathname.replace(/^\/+|\/+$/g,'');return p&&pages[p]?p:'home'}
function go(route,push=true){if(!pages[route])route='home';content.classList.remove('fade');void content.offsetWidth;content.innerHTML=pages[route]();content.classList.add('fade');nav.forEach(b=>b.classList.toggle('active',b.dataset.route===route));if(push){history.pushState({route},'',route==='home'?'/':`/${route}/`)}wireContent();}
function wireContent(){content.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));const idea=document.getElementById('idea'),consent=document.getElementById('consent'),submit=document.getElementById('submit');if(!idea||!consent||!submit)return;const result=document.getElementById('result'),output=document.getElementById('output'),persist=document.getElementById('persist');function sessionId(){let id=localStorage.getItem('turtleblock_session');if(!id){id=crypto.randomUUID();localStorage.setItem('turtleblock_session',id)}return id}function sync(){submit.disabled=!consent.checked||idea.value.trim().length<3}consent.addEventListener('change',sync);idea.addEventListener('input',sync);submit.addEventListener('click',async()=>{submit.disabled=true;submit.textContent='Thinking with it…';result.classList.remove('hidden');output.textContent='';persist.textContent='';try{const r=await fetch('/api/worldspec/interpret',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({utterance:idea.value.trim(),anonymous_session_id:sessionId(),consent_version:'0.1',worldspec_version:'0.1'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');output.className='';output.textContent=JSON.stringify(data.interpretation,null,2);persist.textContent=data.persistence?.stored?'Submission stored for research review.':'Interpretation worked; research persistence is not configured yet.'}catch(e){output.textContent='Error: '+e.message;output.className='error'}finally{submit.textContent='Build with Turtle';sync()}})}
nav.forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));window.addEventListener('popstate',()=>go(routeFromPath(),false));go(routeFromPath(),false);
</script>
</body></html>
