const content=document.getElementById('content'),nav=[...document.querySelectorAll('[data-route]')],navpanel=document.getElementById('navpanel'),panelhead=document.getElementById('panelhead'),menutoggle=document.getElementById('menutoggle');
const mark=(icon='🏠')=>`<div class="markrow"><button class="brandhome" data-go="home" aria-label="TurtleBlock AI home"><img class="brandmark" src="/assets/turtleblock-mark.svg" alt="TurtleBlock AI turtle and bricks on an AI chip"></button><span class="pageicon">${icon}</span><span class="buildpill">🐢 Building in public</span></div>`;
const home=`${mark('🏠')}<h1>TurtleBlock AI</h1><p class="lede"><strong>We built a place to build places.</strong></p><p>TurtleBlock AI helps learners turn ideas into worlds they can build, explore, question, and change.</p><p>Starting with Minecraft, TurtleBlock AI studies how people and machines can think and create together while keeping the learner in control.</p><p>The process is recursive by design: make something, experience it, reflect on what happened, revise it, and make again.</p><div class="actions"><button class="primary" data-go="try">Try It</button><a class="secondary" href="/lab/">Turtle Lab</a><button class="secondary" data-go="research">Research</button><button class="secondary" data-go="build">Build log</button></div><div class="foot">An educational research project by Dr. Bryan P. Sanders, extending decades of recursive work on learning, technology, creativity, and human–machine collaboration.</div>`;
const villageIdea=`I want to make an abandoned village that has clear structures that are in disarray but were once nice, and then in the corner somewhere of the village a little shining light of hope of rebirth.`;
const riverIdea=`Let's make a river that has glowing deep depths and a fishing pier with a hamburger stand.`;
const schoolIdea=`I want to make a WPA-era school site within a city trapped in time, as though nobody wanted to change the style and aesthetic but instead chose to maintain the heritage sites rather than redevelop them.`;
const pages={
 home:()=>home,
 about:()=>`${mark('❓')}<h1>About TurtleBlock AI</h1><p class="lede">TurtleBlock AI is a public educational research and development program exploring how AI can help learners turn ideas into computational worlds, inhabit those worlds, notice what happens, and revise what they made.</p><div class="callout"><strong>Continuing a research program.</strong><p>TurtleBlock AI extends Dr. Bryan P. Sanders' long-running work on learner agency, computational environments, construction, dialogue, reflection, and the relationship between people and machines. The current platform is not detached from that scholarship; it is a new research instrument growing recursively from it.</p></div><h2>Recursion as a learning method</h2><p>Across the research program, recursion means that an idea does not end when it becomes an artifact. Learners make a representation, encounter it in use, notice consequences, reinterpret what they thought, and return to the representation again. Each cycle can change both the artifact and the learner's understanding.</p><div class="loop">make → experience → notice → reflect → revise → make again ↺</div><h2>From Logo to experimental teaching practice</h2><p>The intellectual story begins much earlier than TurtleBlock AI. Sanders' childhood experience with Logo in 1983 established an enduring interest in computers as objects to think with rather than machines that simply deliver answers.</p><p>Beginning in 1995, that interest became a broad field of teaching practice. Early interdisciplinary summer work mixed music and literature; high-school English teaching began in 1997. Across the following decades, Sanders repeatedly combined literature, writing, music, databases, web and media production, theater, performance, culture, games, computational tools, and student-created work. He is a California-credentialed and National Board Certified educator.</p><p>Some experiments turned literary interpretation into systems learners could manipulate. In one recurring form, students curated literary characters in a fantasy-league-style database, used their textual interpretations to build attributes and predictions, and then moved into embodied play—testing those predictions against their understanding of the texts, performance, chance, and one another's judgment. The representation informed the experience; the experience could then challenge the representation.</p><div class="codebox">text → interpretation → structured representation → prediction → embodied experience → reflection → reinterpretation ↺</div><h2>Mid-2010s · Hot Tub Fever</h2><p><em>Hot Tub Fever</em> developed recursively through at least three formal versions, one large-scale production, and numerous smaller iterations. The project mixed literature, literary theory, music, theater, culture, humor, performance, and remix. Each draft could become material for the next: perform, observe, reconsider, rebuild.</p><p>That recursive method is an important bridge to later STEAMHAMLET and TurtleBlock AI. The work was not organized around producing a single final answer; it was organized around making ideas visible enough to be changed.</p><h2>2016–2019 · Doctoral research</h2><p>The dissertation did not begin the inquiry. It formalized questions that had already been developing through roughly two decades of experimental teaching practice.</p><p>From <strong>2016 through 2019</strong>, Sanders' Ed.D. research at Loyola Marymount University examined how the history of educational computing, constructivist theory, critical theory, and the work of John Dewey, Paulo Freire, and Seymour Papert could inform a more unified theory for computers and digital learning environments. The completed dissertation, <em>Toward a Unified Computer Learning Theory: Critical Techno Constructivism</em>, was published in 2019.</p><h2>The Dedoose work matters again</h2><p>A central part of that dissertation was a structured document analysis. Selected passages from Dewey, Freire, and Papert were imported into Dedoose and examined using a literature-derived set of 17 excerpting codes. The study preserved the relationship between theoretical precepts and codes, the frequency with which codes appeared, and significant patterns of co-occurrence across the seminal texts.</p><p>That work created more than a record of qualitative coding. It produced a researcher-authored conceptual map of the ideas that mattered most to the study. TurtleBlock AI now returns recursively to that earlier analysis: the research tags can inform new retrieval, new questions, new implementations, and new rounds of study without erasing their original meaning.</p><div class="codebox">Dewey + Freire + Papert → selected excerpts → Dedoose coding → Critical Techno Constructivism → continuing research ontology → new inquiry ↺</div><h2>Continuing the dissertation</h2><p>The <strong>Dr. Bryan P. Sanders TurtleBlock AI Research Ontology</strong> carries that research structure forward. The original dissertation terminology remains intact as a source layer. Later Sanders-authored tools, publications, presentations, pedagogical experiments, and theoretical developments are added as distinct layers with provenance rather than being blended together or retrospectively rewritten.</p><p>This makes the earlier qualitative research computationally useful in a new way. Turtle can eventually retrieve a relevant dissertation concept, the source passage associated with it, a later Sanders-authored pedagogical tool, or a subsequent publication when that context is useful to a learner's inquiry. The system does not need to ask a language model to rediscover the intellectual organization of the dissertation from scratch; it can begin from the organization created by the researcher and return to it recursively as new evidence and practice emerge.</p><div class="cards"><div class="smallcard"><strong>Original research</strong><p>2016–2019 doctoral inquiry, Dedoose codes, theoretical-precept mappings, frequencies, co-occurrences, and source passages.</p></div><div class="smallcard"><strong>Longitudinal practice</strong><p>Experimental teaching, authored tools, STEAMHAMLET, Minecraft research, Purposeful Play, AI engagement, and co-active emergence.</p></div><div class="smallcard"><strong>Current implementation</strong><p>Turtle Charter, WorldSpec, bounded retrieval, persistent dialogue, reflection, and recursive learner-authored computational worlds.</p></div></div><h2>2023–2026 · From GPTs to persistent research environments</h2><p>As custom GPTs became available, Sanders moved quickly from using conversational models to designing specialized agents. One early experiment was deliberately recursive: a GPT designed to help build better GPTs. The next question was not simply how to write a better prompt, but how to represent the <em>how</em> of agent design itself—its instructions, source material, examples, constraints, categories, and relationships—as structured data that could be inspected and reused.</p><div class="loop">build agent → use agent → study behavior → structure what worked → build the next agent ↺</div><p>The same work expanded into ingestion and research systems for large collections of public documents and government records. Documents became canonical records, entities, relationships, timelines, source layers, and provenance-aware databases that conversational systems could retrieve from instead of pretending to remember an entire corpus.</p><p><strong>Sunshine Machine</strong> pushed that architecture toward persistent computing environments: ingest, tag, sort, relate, retrieve, question, and revise. The research increasingly moved from designing prompts to designing environments—places in which people and machines could participate in an ongoing inquiry rather than begin again from a blank prompt window.</p><div class="codebox">prompt → agent → structured corpus → retrieval → dialogue → revision → persistent environment ↺</div><h2>Co-active emergence becomes method as well as theory</h2><p>The iterative writing that led toward co-active emergence followed the same recursive pattern. Human ideas produced machine responses; those responses became material for evaluation and disagreement; evaluation generated new questions and revisions; and subsequent exchanges changed the conditions for what could emerge next.</p><p>Over time, the work moved from building things with computers, to building environments for thinking with computers, to building systems in which people and machines can recursively construct meaning together.</p><h2>Research ontology, not machine ideology</h2><p>The ontology is intentionally provenance-aware. An original Dedoose code is not the same thing as a later interpretation, a pedagogical tool, a Turtle behavior, or a learner's own meaning. Keeping those categories separate allows TurtleBlock AI to use scholarship without pretending that machine inference came from the dissertation—or that the learner's ideas came from the machine.</p><div class="codebox">original research ≠ later scholarship ≠ Turtle interpretation ≠ learner meaning</div><h2>Not an AI world vending machine</h2><p>The goal is not to turn a learner's sentence into a finished Minecraft build and call that learning. TurtleBlock AI is intended to help learners externalize ideas, represent them, test them, inhabit consequences, reflect on them, and recursively reconstruct them. The learner remains the designer and producer.</p><h2>RE/EDUCATION · focused continuation</h2><p>Since 2022, RE/EDUCATION has provided a deliberately smaller and more focused setting in which the same questions can be studied through closely connected teaching, research, design, and technological experimentation. The wide funnel of earlier practice continues on a tighter scale: design, try, observe, revise, and return.</p><div class="pills"><button class="pill" data-go="research">Research</button><button class="pill" data-go="charter">Turtle Charter</button><a class="pill" href="https://digitalcommons.lmu.edu/etd/901/" target="_blank" rel="noopener noreferrer">2019 dissertation</a><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/Dr_Bryan_P_Sanders_TurtleBlockAI_Taxonomy.md" target="_blank" rel="noopener noreferrer">Ontology documentation</a></div>`,
 worldspec:()=>`${mark('📐')}<h1>WorldSpec</h1><p class="lede">WorldSpec is the edition-independent representation layer between a learner's idea, a conversation with Turtle, and a world that can be built, inhabited, tested, reflected upon, and revised.</p><div class="loop">learner intent → dialogue → WorldSpec → build → inhabit → notice → reflect → revise → return ↺</div><h2>Recursive by design</h2><p>WorldSpec makes the learning process recursive. A build is not treated as the endpoint of an idea: what happens in the world becomes new information that can return to the same persistent representation and change it.</p><div class="cards"><div class="smallcard"><strong>Schema</strong><p>Objects, relationships, form, function, materials, meaning, constraints, reflection, and history.</p></div><div class="smallcard"><strong>Lexicon</strong><p>Construction, inquiry, social, semantic, reflective, uncertainty, and provenance language.</p></div><div class="smallcard"><strong>Grammar + syntax</strong><p>Rules for action, interpretation, questions, negation, contradiction, deixis, comparison, and revision.</p></div></div><h2>Lossless before normalized</h2><p>A learner's original language is primary data. Turtle may normalize concepts it understands, but unknown, poetic, emotional, symbolic, narrative, cultural, spatial, and deliberately strange language must not disappear simply because the current parser cannot classify it.</p><div class="codebox">raw learner phrase → explicit meaning → provisional interpretation → unresolved meaning → WorldSpec delta</div><h2>Persistent, not regenerated</h2><p>A Turtle conversation should create a persistent WorldSpec immediately. Each turn recursively revises that same object so the learner can see how an idea develops instead of receiving a fresh interpretation from scratch every time.</p><h2>Provenance matters</h2><p>WorldSpec distinguishes learner statements, Turtle interpretations, world observations, manual edits, corrections, and later revisions. That boundary lets the learner disagree with Turtle without losing the original idea and lets research inspect change without pretending machine inference came from the learner.</p><h2>Research ontology beside WorldSpec</h2><p>WorldSpec represents the learner's evolving project; the Sanders research ontology represents scholarly and pedagogical lineage. They are deliberately separate. Turtle may retrieve a relevant dissertation code, authored CTC tool, or later publication to inform dialogue, but the retrieved research does not overwrite the learner's meaning.</p><div class="codebox">learner meaning ≠ research concept ≠ Turtle interpretation</div><h2>Semantic words are not geometry</h2><p>Words such as <em>welcoming</em>, <em>authoritarian</em>, <em>sacred</em>, <em>communal</em>, <em>hopeful</em>, or <em>abandoned</em> should remain visible as semantic intent. They may require dialogue, examples, or recursive experimentation rather than silently becoming a fixed arrangement of blocks.</p><h2>Hostile data pass</h2><p>WorldSpec deliberately tests ambiguous references, contradictions, questions that must not execute, learner-defined meanings, social disagreement, manual edits, unknown values, and language such as “make the castle more Tuesday.” The point is to discover where a representation system destroys meaning before Minecraft makes that destruction look polished.</p><div class="codebox">principle → interpreter rule → WorldSpec representation → hostile test → revision ↺</div><h2>Portable artifact</h2><p>WorldSpecs are intended to remain inspectable and exportable as structured artifacts, with revision history and conversation provenance attached. Minecraft is one adapter, not the definition of the idea.</p><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform/tree/main/worldspec" target="_blank">WorldSpec on GitHub</a><button class="pill" data-go="charter">Turtle Charter</button><button class="pill" data-go="research">Research ontology</button></div>`,
 charter:()=>`${mark('📜')}<h1>Turtle Charter</h1><p class="lede">A living constitution for what Turtle should do, what Turtle may do, and what Turtle must leave to the learner.</p><div class="callout"><strong>The central boundary</strong><p>Turtle may contribute information, possibilities, patterns, consequences, questions, prototypes, comparisons, technical assistance, interpretations, and experiments. Purpose, meaning, judgment, values, ownership, decisions, reflection, disagreement, and the right to change one's mind remain with the learner.</p></div><div class="charteritem"><strong>1. Act when intention is concrete</strong><p>Direct execution is for sufficiently concrete, reversible requests. Ambiguous meaning starts with dialogue.</p></div><div class="charteritem"><strong>2. Prefer reversible proposals</strong><p>Low-stakes uncertainty can become a labeled proposal; consequential ambiguity requires clarification.</p></div><div class="charteritem"><strong>3. Suggest sparingly</strong><p>Turtle proposals must remain visibly distinct from learner intent.</p></div><div class="charteritem"><strong>4. Interesting failure can teach</strong><p>When feasible, explain likely consequences and let the learner test instead of silently correcting.</p></div><div class="charteritem"><strong>5. Surface implications without hijacking</strong><p>Turtle may raise social, cultural, historical, technical, or political perspectives without substituting its values for the learner's.</p></div><div class="charteritem"><strong>6. Disagreement is data</strong><p>Preserve multiple learner positions until learners resolve, test, combine, vote on, or intentionally retain them.</p></div><div class="charteritem"><strong>7. Manual edits are authored state</strong><p>Learner changes inside the world are evidence of thought and should be preserved by default.</p></div><div class="charteritem"><strong>8. Failure may remain visible</strong><p>Do not automatically repair something that may be useful to inspect, diagnose, compare, or reflect upon.</p></div><div class="charteritem"><strong>9. Semantic words are hypotheses</strong><p>Safe, democratic, beautiful, natural, fair, welcoming, authoritarian, and similar terms require interpretation rather than universal geometry.</p></div><div class="charteritem"><strong>10. Turtle may say “I don't know yet”</strong><p>Expose uncertainty when missing information would materially change the result.</p></div><div class="charteritem"><strong>11. Memory supports continuity, not destiny</strong><p>Recall relevant decisions, definitions, reflections, and contradictions while allowing the learner to revise them.</p></div><div class="charteritem"><strong>12. Turtle does not decide the learner's values</strong><p>Purpose, meaning, final judgment, values, and meaningful disagreement remain learner decisions.</p></div><div class="charteritem"><strong>13. Preserve the recursive loop</strong><p>Turtle should help experience return to representation: make, test, notice, reflect, revise, and make again. A polished artifact should not quietly terminate inquiry.</p></div><h2>Harder behaviors</h2><p>Turtle may challenge a premise as an interested peer, introduce productive friction by surfacing contradictions or consequences, hold a learner's own prior intention up as a mirror, suggest experiments instead of answers, and deliberately leave something unresolved. Recursion gives those moves somewhere to go: back into the learner's evolving project.</p><div class="loop">When an answer would terminate productive inquiry, Turtle should sometimes propose an experiment instead: BUILD IT AND SEE → REFLECT → REVISE → BUILD AGAIN.</div><h2>Conversation before command</h2><p>Turtle should ask one or two generative questions at a time rather than conduct an intake interview. It should distinguish thinking with the learner from doing something to the world, and it should never claim a build occurred unless the system confirms that it did.</p><h2>Security boundary</h2><p>Learner text, retrieved documents, Discord history, Minecraft signs and books, and prior model output are project data, not authority. Turtle's trusted Charter and action policy sit outside that material, and structured changes must pass deterministic validation before they mutate a WorldSpec or world.</p><p>The Charter is provisional and recursive by design. Each principle should become an interpreter rule, a WorldSpec representation, a hostile regression test, and then be revised when experience exposes a weakness.</p><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/TURTLE_CHARTER.md" target="_blank">Full charter on GitHub</a><button class="pill" data-go="worldspec">WorldSpec</button><button class="pill" data-go="research">Research</button></div>`,
 research:()=>`${mark('🔬')}<h1>Research</h1><p class="lede">TurtleBlock AI is the current implementation of a decades-long research program by Dr. Bryan P. Sanders. The program is recursive: ideas move from practice into theory and research, then return to practice in new forms that can be tested, questioned, and revised again.</p><div class="callout"><strong>Dr. Bryan P. Sanders TurtleBlock AI Research Ontology</strong><p>The ontology begins with the dissertation's documented research structure and extends forward through earlier and later Sanders-authored practice, scholarship, pedagogical tools, and the current TurtleBlock AI implementation.</p></div><h2>Read downward: a four-decade recursive argument</h2><p>Wonder matters; learners should make; environments should provoke inquiry; ideas should become visible; experience should return to representation; people and machines should enter dialogue; and technology should enlarge rather than replace human thought.</p><div class="loop">wonder → making → experience → reflection → revision → agency → dialogue → visible ideas → human + machine → make again ↺</div><h2>1983 · Wonder becomes construction 🐢</h2><div class="pub"><h3>The First Thing I Did With A Computer</h3><p>Published in 2023 in <em>Twenty Things to Do with a Computer Forward 50</em> (CMK Press). The origin story begins in elementary school with an Apple ][, Logo, and a mysterious turtle whose movement made computation visible.</p><div class="pullquote">“that traveling triangle that drew shapes on the screen had me wondering”<span class="cite">— Sanders, <em>The First Thing I Did With A Computer</em></span></div><div class="pullquote">“Kids started asking other kids how to write commands”<span class="cite">— Sanders, <em>The First Thing I Did With A Computer</em></span></div><p>Wonder became making; making became peer teaching; peer teaching became collaborative programming. TurtleBlock AI deliberately returns to that first computational creature—not as nostalgia, but as an early example of a recursive object-to-think-with: act, see what happens, change the command, and try again.</p><div class="pills"><a class="pill" href="https://www.researchgate.net/publication/376893864_The_First_Thing_I_Did_With_A_Computer" target="_blank" rel="noopener noreferrer">Read the Logo reflection</a></div></div><h2>1995–2022 · The experimental classroom</h2><div class="pub"><h3>Practice before formal theory</h3><p>Beginning with interdisciplinary summer teaching in 1995 and high-school English teaching in 1997, Sanders developed a broad experimental practice spanning literature, writing, music, databases, web and media production, theater, performance, culture, games, computational environments, and student-created work. The common pattern was recursive: learners represented an idea, did something with it, encountered consequences, and returned to the idea differently.</p><p>One literature experiment used a fantasy-league-style database of literary characters. Students curated characters as structured information, debated attributes and interpretations, generated predictions, and then moved into physical play. Their enacted outcomes drew at once on database predictions, textual knowledge, performance, chance, and judgment.</p><div class="loop">literary text → interpretation → database → prediction → embodied play → observation → reinterpretation ↺</div><p>The important boundary was already present: the database could contribute a representation, but it did not own the meaning of the literature. Experience could contradict the model and send learners back to revise their assumptions.</p><p>Across this period Sanders worked as a California-credentialed and National Board Certified educator. The later research program grows from this long field of practice rather than replacing it.</p></div><h2>Mid-2010s · Hot Tub Fever</h2><div class="pub"><h3>A recurring mashup theater experiment</h3><p><em>Hot Tub Fever</em> developed through at least three formal versions, one large-scale event, and numerous smaller drafts and iterations. Literature and literary theory mixed with music, theater, culture, humor, performance, and remix. The production itself became material for subsequent production.</p><div class="loop">draft → rehearsal → performance → observation → reinterpretation → new draft ↺</div><p>The recursion is central: the work was not simply revised on the way to a final product. Re-performance and reconstruction were part of the intellectual method.</p></div><h2>2016–2019 · Doctoral research program</h2><div class="pub"><h3>Toward a Unified Computer Learning Theory: Critical Techno Constructivism</h3><p>The dissertation did not begin the inquiry. It formalized questions that had already been developing through roughly two decades of experimental teaching practice.</p><p>From 2016 through 2019, Sanders' Ed.D. research at Loyola Marymount University examined the history of classroom computer use and brought constructivist and critical traditions into dialogue with contemporary digital learning environments. The completed dissertation was published in 2019.</p><p>The study included document analysis of selected passages from John Dewey, Paulo Freire, and Seymour Papert. Those excerpts were imported into Dedoose and coded with a literature-derived system. The dissertation preserved theoretical-precept mappings, frequencies, and significant code co-occurrences across the three seminal works.</p><div class="pullquote">“Our job is to tune into and tap into their meaning-making.”<span class="cite">— Sanders, LMU Graduate Student Summit (2018)</span></div><div class="pullquote">“deeply and purposefully, mix up electronics with people”<span class="cite">— Sanders, doctoral research (2018–2019)</span></div><p>The 17 original codes remain intact as the source layer of the current research ontology:</p><div class="codebox">Abstractions · Banking Model · Connectivism · Constructivism · Discovery Learning · Engagement · Freedom and Individuality · Institutional Change · Isolated Curricula · Observations on Life Itself · Oppression · Pedagogy · Predetermined Outcomes · Problem Posing Education · Shared Democracy · Social Impact · Theory</div><p>The original research terminology remains fixed; later scholarship, earlier pedagogical artifacts, and TurtleBlock mappings are added with explicit provenance. That allows the dissertation itself to participate in a new recursive cycle of research without being rewritten after the fact.</p><div class="pills"><a class="pill" href="https://digitalcommons.lmu.edu/etd/901/" target="_blank" rel="noopener noreferrer">Read the dissertation at LMU</a><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/Dr_Bryan_P_Sanders_TurtleBlockAI_Taxonomy.md" target="_blank" rel="noopener noreferrer">Research ontology documentation</a></div></div><h2>2016 · Co-construct the curriculum</h2><div class="pub"><h3>STEAMHAMLET: A Transformative Situated Inquiry</h3><p>During the opening year of the doctoral study, the research-development model was already explicitly recursive: study the history, develop theory, build a prototype, pilot it with students, and further develop the program from their input.</p><div class="pullquote">“Why don’t we respond to the people in the room and co-construct the curriculum?”<span class="cite">— Sanders, <em>STEAMHAMLET: A Transformative Situated Inquiry</em> (2016)</span></div><p>That question foreshadows TurtleBlock AI's emphasis on persistent dialogue and learner-authored revision.</p></div><h2>Critical Techno Constructivism · Theory becomes operational</h2><div class="pub"><h3>Tenets, Questions, and Actions</h3><p>Sanders subsequently operationalized Critical Techno Constructivism as seven pedagogical tenets, each connected to a diagnostic question and action guidance:</p><div class="codebox">Personal Inquiry → Compelling Problem or Question → Technology as Tool to Think With → Formative Demonstration of Learning → Reflection as Learning → Social and Cultural Critique → Sharing and Collaborating</div><p>This later operational framework is linked to—but kept distinct from—the dissertation's Dedoose taxonomy. The questions and actions also make the theory recursive: reflection and critique return experience to the next round of inquiry.</p></div><h2>2021 · Possible Possibles</h2><div class="pub"><h3>Students-mostly-constructing</h3><p>The learning environment is described as high-ceiling, collaborative, open-ended, and built for repeated iteration, recursion, and remix rather than a single correct endpoint.</p><div class="pullquote">“We need a high ceiling, multiple entry points, a communication system, and a collaborative workspace. We need a place to practice, dream, and build.”<span class="cite">— Sanders, <em>Possible Possibles</em> (2021)</span></div><p>That language now maps naturally to persistent Turtle sessions, revisable WorldSpecs, and eventually inhabitable Minecraft worlds.</p></div><h2>2021 · The environment becomes the curriculum</h2><div class="pub"><h3>Could Minecraft Be a School?</h3><p>Published in Springer's <em>Game-based Learning Across the Disciplines</em>. Minecraft is treated not as another instructional application but as a persistent environment where learner action, conflict, collaboration, discovery, and recursive rebuilding can generate curriculum.</p><div class="pullquote">“reject the worksheet and instead take control of their own minds”<span class="cite">— Sanders, <em>Could Minecraft Be a School?</em> (2021)</span></div><div class="pullquote">“dialogue and questions naturally occurring among students will create a curriculum”<span class="cite">— Sanders, <em>Could Minecraft Be a School?</em> (2021)</span></div><p>That move—from prescribed lesson to generative environment—is exactly what WorldSpec and the Turtle conversation layer are meant to preserve.</p><div class="pills"><a class="pill" href="https://doi.org/10.1007/978-3-030-75142-5_17" target="_blank" rel="noopener noreferrer">Springer / DOI</a></div></div><h2>2022 · Dialogue rebuilds learning</h2><div class="pub"><h3>Purposeful Play – Educating with Minecraft</h3><p>Published by Minecraft Education. Here the learner-centered environment becomes pedagogical practice: authentic problems emerge during play, students ask what they need to know, and teachers join them inside a recursive inquiry.</p><div class="pullquote">“It’s a story in motion, a story in progress. A story they can make, walk around in, and change.”<span class="cite">— Sanders, Minecraft Education (2022)</span></div><div class="pullquote">“Students and teachers enter a dialogue and co-construct the class curriculum.”<span class="cite">— Sanders, Minecraft Education (2022)</span></div><p>Turtle's Charter extends this same relationship. The agent should not own the curriculum; it should participate in the recursive dialogue through which curriculum emerges.</p><div class="pills"><a class="pill" href="https://education.minecraft.net/en-us/blog/purposeful-play" target="_blank" rel="noopener noreferrer">Read at Minecraft Education</a></div></div><h2>2022–present · RE/EDUCATION</h2><div class="pub"><h3>A tighter setting for continuing inquiry</h3><p>RE/EDUCATION provides a deliberately smaller and more focused environment in which the same long-running questions can continue through closely connected teaching, research, design, and technological experimentation. The broad earlier practice becomes a tighter recursive loop: design, try, observe, revise, and return.</p></div><h2>2051 imagined · Ideas become objects</h2><div class="pub"><h3>Vignette: STEAMHAMLET Is School 2051</h3><p>Published in the Springer volume <em>Artificial Intelligence, Human Agency and the Educational Leader</em>. The imagined classroom is student-centered, multidisciplinary, human-and-machine blended, conversational, and capable of turning ideas into manipulable objects.</p><div class="pullquote">“It is a room of possibilities.”<span class="cite">— Sanders, <em>STEAMHAMLET Is School 2051</em></span></div><div class="pullquote">“The room learns as it receives input.”<span class="cite">— Sanders, <em>STEAMHAMLET Is School 2051</em></span></div><p>WorldSpec now makes that vision increasingly literal: language becomes structured but revisable objects, conversations modify them, worlds provide new experience, and that experience can return recursively to the representation.</p><div class="pills"><a class="pill" href="https://www.researchgate.net/publication/376893403_STEAMHAMLET_is_school_2051" target="_blank" rel="noopener noreferrer">Read the vignette</a><a class="pill" href="https://steamhamlet.com" target="_blank" rel="noopener noreferrer">STEAMHAMLET archive</a></div></div><h2>2023 · The dam has burst</h2><div class="pub"><h3>Engaging with AI — A Radical Shift for the Future, Today</h3><p>Published in <em>California English</em>, Vol. 29, No. 2. The argument shifts from preventing access to computational answers toward learning how to engage those answers critically and recursively: machine responses become material for evaluation, dialogue, revision, and another round of inquiry.</p><div class="pullquote">“critical thinking depends upon our ability to view these machine responses as material for students to engage with and evaluate.”<span class="cite">— Sanders, <em>California English</em> (2023)</span></div><div class="pullquote">“what does it look like to teach and learn and collaborate in the Age of AI?”<span class="cite">— Sanders, <em>California English</em> (2023)</span></div><p>The question is no longer whether the machine enters the intellectual environment. The design problem is what kind of relationship we construct once it is there—and how each exchange can become material for the next.</p><div class="pills"><a class="pill" href="https://www.cateweb.org/journals/november-2023/" target="_blank" rel="noopener noreferrer">California English issue</a><a class="pill" href="https://www.researchgate.net/publication/375769340_Engaging_with_AI_--_A_radical_shift_for_the_future_today_It's_already_yesterday" target="_blank" rel="noopener noreferrer">Article copy</a></div></div><h2>2023–2024 · From using GPTs to building GPTs</h2><div class="pub"><h3>Recursive agent design</h3><p>As custom GPTs became available, Sanders moved quickly from using conversational models to designing specialized conversational systems. One early experiment was deliberately recursive: a GPT designed to help build better GPTs.</p><p>The work soon moved beyond prompt-writing. Agent design itself became structured data: instructions, source material, categories, examples, constraints, relationships, tables, rows, fields, and recurring patterns that could be inspected, compared, reused, and revised.</p><div class="loop">build agent → use agent → study behavior → structure what worked → build the next agent ↺</div></div><h2>2024–2026 · Ingestion and persistent research systems</h2><div class="pub"><h3>From document piles to structured evidence</h3><p>The agent work expanded into systems for large collections of public documents and government records. Meeting materials, correspondence, reports, timelines, people, organizations, places, financial relationships, and source documents were progressively ingested, normalized, linked, and made retrievable.</p><p>The model was no longer expected to remember an entire corpus. The research increasingly concentrated on the structured environment around the model: canonical records, entities, relationships, timelines, provenance, and explicit distinctions between evidence and interpretation.</p><div class="loop">documents → ingestion → structured records → entities + relationships → retrieval → dialogue → new questions → more records ↺</div></div><h2>2025–2026 · Sunshine Machine</h2><div class="pub"><h3>From prompting to participation</h3><p><strong>Sunshine Machine</strong> developed the idea of persistent computing environments organized around intentional corpora: ingest, tag, sort, relate, retrieve, question, and revise. Instead of repeatedly asking a blank machine the perfect question, the environment itself carries history, structure, provenance, and relationships forward.</p><div class="pullquote">“No prompting. Just participation.”<span class="cite">— Sanders, Sunshine Machine research-development principle</span></div><p>The research increasingly moved from designing prompts to designing environments. TurtleBlock AI inherits that move.</p></div><h2>2025 · Co-active emergence</h2><div class="pub"><h3>GPT and Me, An Honest Reevaluation: The Dawn of Co-active Emergence</h3><p>Published in <em>Impacting Education</em>. The machine is no longer merely environment or tool: purposeful human-machine dialogue itself becomes a recursive intellectual process in which each contribution can alter the conditions for what comes next.</p><div class="pullquote">“human intelligence and machine intelligence converge on purpose”<span class="cite">— Sanders, <em>The Dawn of Co-active Emergence</em> (2025)</span></div><div class="pullquote">“This is not a copy/paste model”<span class="cite">— Sanders, <em>The Dawn of Co-active Emergence</em> (2025)</span></div><p>The writing and theory themselves developed recursively: human ideas produced machine responses; responses became material for evaluation; evaluation produced new questions and revisions; and subsequent exchanges changed what could emerge next.</p><div class="loop">human idea → machine response → human evaluation → revision → new dialogue → emerging concept ↺</div><div class="pills"><a class="pill" href="https://impactinged.pitt.edu/ojs/ImpactingEd/article/view/479" target="_blank" rel="noopener noreferrer">Read the article</a></div></div><h2>2026 · The argument becomes executable</h2><div class="callout"><strong>TurtleBlock AI</strong><p>The current platform brings these strands together: the Logo turtle's inspectable action, decades of recursive classroom experimentation, the dissertation's coded research ontology, Critical Techno Constructivism's learner agency, specialized agents, structured ingestion systems, Sunshine Machine's persistent computing environment, Minecraft's inhabitable learning space, and co-active emergence's purposeful human-machine dialogue.</p><div class="loop">learner language → Turtle dialogue → persistent WorldSpec → construction → inhabitation → consequence → reflection → revision → new dialogue ↺</div><p>The research tagging is now part of that recursive implementation. An original Dedoose code, an authored pedagogical tool, a later publication, a pedagogical experiment, a retrieved source, a TurtleBlock mapping, and the learner's current meaning can remain distinct while still informing one another across successive cycles of inquiry.</p><p>TurtleBlock AI is less a departure into artificial intelligence than another recursion through a long-running question: how can people build environments with computers that make ideas visible, manipulable, discussable, inhabitable, and open to change?</p></div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/Dr_Bryan_P_Sanders_TurtleBlockAI_Taxonomy.md" target="_blank" rel="noopener noreferrer">Ontology architecture</a><a class="pill" href="https://scholar.google.com/scholar?q=%22Bryan+P.+Sanders%22+education" target="_blank" rel="noopener noreferrer">Google Scholar</a><a class="pill" href="https://orcid.org/0000-0001-6866-7280" target="_blank" rel="noopener noreferrer">ORCID</a><a class="pill" href="https://read.bryansanders.com" target="_blank" rel="noopener noreferrer">More writing</a></div>`,
 build:()=>`${mark('🔧')}<h1>Build Log</h1><p class="lede">A running history of the code, mistakes, reversals, research questions, and architecture. New milestones append; older ones stay visible.</p><div class="stage"><span class="date">Aug 30–31, 2026</span><strong class="done">✓ Public platform foundation</strong><p>GitHub organization, Cloudflare deployment, turtleblockai.com, public shell, health endpoint, project pages, privacy and terms scaffolding.</p></div><div class="stage"><span class="date">Aug 31, 2026</span><strong class="done">✓ WorldSpec v0.1</strong><p>Schema, lexicon, grammar, syntax, hostile cases, deterministic interpreter, and Turtle Charter.</p></div><div class="stage"><span class="date">Aug 31–Sep 1, 2026</span><strong class="done">✓ Discord Turtle installed</strong><p>TurtleBlock AI app created, installed in STEAMHAMLET, and /turtle registered for the guild.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ First Discord → WorldSpec flight</strong><p>A learner idea reached the Worker, generated a WorldSpec preview, received a Minecraft handoff ID, and returned to Discord.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Lossless dialogue architecture</strong><p>Shifted from keyword-first parsing toward persistent conversational Turtle sessions where learner language is preserved before normalization.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ LLM/RAG/security architecture</strong><p>Defined trusted Turtle Charter instructions, bounded retrieval, untrusted learner/RAG data, structured WorldSpec deltas, and deterministic action validation.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ LLM-backed opening dialogue wired</strong><p>/turtle can acknowledge immediately, call the conversational model layer, then replace the waiting Discord response while retaining deterministic fallback.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Turtle Lab publication model</strong><p>Private conversation by default; learner-selected public artifacts, WorldSpec snapshots, outputs, reflections, and selected dialogue may later feed Turtle Lab.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Persistent-state schema designed</strong><p>Turtle sessions, turns, WorldSpec revisions, and publication records defined for D1.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Research lineage made executable and public</strong><p>Published work on Critical Techno Constructivism, Minecraft as school, purposeful play, STEAMHAMLET, AI engagement, and co-active emergence is now explicitly connected to the live TurtleBlock architecture.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Persistent Turtle conversation endpoint</strong><p>The web Playground and repeated Discord /turtle turns can now continue the same session and recursively revise the same WorldSpec when D1 is active.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Sanders D1 research ontology foundation</strong><p>D1 migration 0003 preserves the original 17 dissertation Dedoose codes, theoretical-precept mappings, source metrics, relationships, source passages, and retrieval scaffolding as a provenance-aware scholarly layer.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Authored tools + longitudinal ontology extension</strong><p>D1 migration 0004 adds Sanders-authored operational tools, the seven Critical Techno Constructivism Tenet → Question → Action structures, later research concepts, selected retrieval passages, and explicit later mappings back to the original dissertation taxonomy.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Recursion made explicit across the public research narrative</strong><p>The WWW now names the recurring method directly: representation becomes experience; experience becomes reflection; reflection returns to revision and another round of making.</p></div><div class="stage"><span class="date">Current edge</span><strong>→ Activate + query the ontology</strong><p>Apply the new D1 migrations in production, then expose bounded ontology retrieval to Turtle so a conversation can retrieve relevant codes, authored tools, and source passages without dumping the full corpus into the model context.</p></div><div class="stage"><span class="date">Next</span><strong>→ Native Discord conversation + Minecraft adapter</strong><p>Continue ordinary Turtle Lab thread dialogue on the same persistent WorldSpec, then translate validated operations into the first controlled Minecraft construction bridge.</p></div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform" target="_blank" rel="noopener noreferrer">Public repository</a><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/Dr_Bryan_P_Sanders_TurtleBlockAI_Taxonomy.md" target="_blank" rel="noopener noreferrer">Research ontology</a><a class="pill" href="/lab/">Turtle Lab</a></div>`,
 steamhamlet:()=>`${mark('🌀')}<h1>STEAMHAMLET → TurtleBlock AI</h1><p class="lede">STEAMHAMLET is the earlier room of possibilities behind TurtleBlock AI: a shared learning environment where ideas and informational objects can be moved, changed, scaled, remixed, juxtaposed, tested, and recursively revised.</p><p>TurtleBlock AI gives that long-running educational vision a more immediately executable playground through conversational agents, WorldSpec, Minecraft, and a public build process.</p><div class="loop">idea → representation → interaction → reflection → revision → new representation ↺</div><h2>The same underlying question</h2><p>What happens when the computer stops behaving mainly like a delivery machine and instead becomes a place to think, construct, collaborate, encounter consequences, and recursively revise?</p><h2>A room of possibilities</h2><p>STEAMHAMLET imagines ideas becoming objects: things that can be called on stage, moved, scaled, combined, juxtaposed, discussed, and reconstructed. Its 2051 vignette imagines a room that learns through input and blends human and machine participation without making the machine the owner of the experience.</p><h2>Recursion is the room's method</h2><p>An idea can enter the room, become visible, be manipulated or performed, encounter other ideas and people, and return changed. The result is not a final object but another possible starting point.</p><h2>From imagined room to executable representation</h2><p>WorldSpec is increasingly a practical descendant of that vision. Language becomes manipulable structure; structure becomes a world; the learner inhabits what was made; reflection returns to the representation; and the next version emerges recursively from the encounter.</p><h2>Why Minecraft matters</h2><p>Minecraft provides an unusually legible construction space: ideas become spatial, social, material, and revisable. It can function less like a lesson-delivery application and more like a place in which curriculum is recursively generated by what learners choose to build, notice, contest, and change.</p><h2>Why Turtle matters</h2><p>Turtle adds a conversational collaborator to that room—not a teacher replacement and not a vending machine. It can hold continuity, surface implications, help make ideas inspectable, and participate in the learner's recursive movement between language, construction, experience, and revision.</p><div class="pills"><a class="pill" href="https://steamhamlet.com" target="_blank" rel="noopener noreferrer">Open STEAMHAMLET</a><button class="pill" data-go="research">Research lineage</button><button class="pill" data-go="worldspec">WorldSpec</button></div>`,
 reeducation:()=>`${mark('🏫')}<h1>TurtleBlock AI + RE/EDUCATION</h1><p class="lede">TurtleBlock AI is being developed as part of the educational practice, research, and school-building work of RE/EDUCATION.</p><div class="callout"><strong>A school can also be a laboratory.</strong><p>TurtleBlock AI provides a place to design, test, revise, and study new forms of learner-centered computational experience while those experiences are being built.</p></div><h2>A focused continuation</h2><p>Since 2022, RE/EDUCATION has provided a deliberately smaller and more focused setting for a research and teaching practice that began decades earlier. The scale is tighter, but the method remains recursive: design an experience, try it, observe closely, revise the theory or design, and return to practice.</p><div class="loop">practice → observation → theory → design → practice again ↺</div><h2>Credentialed practice meets research</h2><p>The project connects day-to-day work as a California-credentialed and National Board Certified educator with doctoral and post-doctoral inquiry into constructivism, constructionism, digital learning environments, Minecraft, artificial intelligence, and co-active emergence.</p><h2>Not a detached software demo</h2><p>TurtleBlock AI is intended as a functional playground for actual educational work: learners making things, teachers participating in inquiry, and the platform itself changing in response. Educational use is not an after-market justification for the technology; it is the recursive design context.</p><h2>School-building as R&amp;D</h2><p>RE/EDUCATION provides a practical setting for asking what new learning environments might look like when school is treated as something that can be deliberately redesigned rather than merely digitized. TurtleBlock AI is one experimental layer in that larger work.</p><h2>Research, practice, and recursive construction</h2><p>The project keeps those domains connected. Research informs the Charter and WorldSpec; practice challenges the assumptions; field tests create new questions; and those questions return to research and design.</p><h2>Related work</h2><p>RE/EDUCATION is one part of a larger recursive trail that includes STEAMHAMLET, Critical Techno Constructivism, Minecraft-centered research and writing, co-active emergence, and TurtleBlock AI.</p><div class="pills"><a class="pill" href="https://reeducationllc.com" target="_blank">Visit RE/EDUCATION</a><button class="pill" data-go="research">Research</button><button class="pill" data-go="charter">Turtle Charter</button></div>`,
 privacy:()=>`${mark('🔐')}<h1>Playground Privacy</h1><p class="lede">TurtleBlock AI is an experimental educational research and development project. Privacy boundaries are part of the architecture, not a footnote.</p><div class="callout"><strong>Private by default.</strong><p>A Turtle conversation is not automatically a public artifact. Turtle Lab publication requires an intentional learner-facing publication step.</p></div><h2>What the Playground receives</h2><p>When you submit material through the TurtleBlock AI Playground, the system receives the text you submit, the version of WorldSpec and the privacy notice associated with the interaction, and a random browser session identifier that may connect related revisions. The public Playground does not require you to identify yourself.</p><h2>How Playground submissions may be used</h2><p>Playground submissions may be processed to operate, evaluate, research, develop, and improve TurtleBlock AI, Turtle, WorldSpec, related educational tools, and future research or evaluation datasets. Automated systems may process submissions, and material may also be reviewed by people involved in TurtleBlock AI research and development.</p><h2>Research-data pipeline</h2><p>TurtleBlock AI separates a raw Playground submission from an approved research or training dataset record. The planned pipeline screens submissions, creates a redacted copy when appropriate, assigns review and dataset states, and requires an explicit review decision before material is treated as approved dataset material.</p><p>Research persistence is activated only when the project database is configured. Until that infrastructure is enabled, a Playground interaction may be interpreted and returned without being written to the TurtleBlock AI research database.</p><h2>Please do not submit personal or sensitive information</h2><p>This includes passwords, authentication tokens, financial information, medical information, confidential school records, private communications, government identifiers, or information about other people that you do not have permission to share.</p><h2>Anonymous sessions and infrastructure metadata</h2><p>A random browser session identifier may be stored so related interactions and revisions can be studied together. TurtleBlock AI does not intentionally place IP addresses into the Playground research dataset. Hosting, security, networking, and infrastructure providers may independently process ordinary technical metadata necessary to provide and protect their services.</p><h2>Discord and community conversation</h2><p>Ordinary conversation in a TurtleBlock AI Discord server or community channel is not automatically treated as a TurtleBlock AI research-dataset submission. Explicit Turtle interactions and future research-enabled flows should identify the applicable boundary and consent model.</p><h2>No surveillance theater</h2><p>The goal is not to indiscriminately collect everything learners say because technically it could be useful later. TurtleBlock AI is being designed around bounded project context, provenance, explicit publication, and intentional research capture rather than broad ambient monitoring.</p><h2>Third-party services</h2><p>TurtleBlock AI may connect with services such as Discord, Cloudflare, GitHub, Minecraft or Microsoft services, and model or infrastructure providers. Those services operate under their own terms and privacy practices.</p><h2>Consent and changes</h2><p>Before submitting through a research-enabled Playground flow, you may be asked to acknowledge the applicable privacy notice. Because TurtleBlock AI is actively being developed, this notice may change as features, integrations, and research practices evolve.</p><h2>Project context</h2><p>TurtleBlock AI is a build-in-public educational research project associated with RE/EDUCATION and the ongoing educational and doctoral research of Dr. Bryan P. Sanders.</p><div class="foot">Privacy notice · evolving with the platform</div>`,
 disclaimer:()=>`${mark('⚠️')}<h1>Disclaimer</h1><p class="lede">TurtleBlock AI is experimental educational research and development software. It is built in public, changes quickly, and may be incomplete, unavailable, inaccurate, surprising, or wrong.</p><div class="callout"><strong>Turtle is a collaborator, not an authority.</strong><p>Outputs are proposals, interpretations, questions, computational representations, and experimental assistance. Human judgment remains necessary.</p></div><h2>No professional advice</h2><p>Nothing produced by TurtleBlock AI should be treated as legal, medical, financial, psychological, safety-critical, or other professional advice. Consult an appropriately qualified professional when a decision requires professional judgment.</p><h2>Experimental software</h2><p>Features may change, fail, reset, or disappear as the project develops. WorldSpecs, conversations, integrations, builds, and generated outputs may contain errors. Keep your own copies of important work and verify anything consequential before relying on it.</p><h2>AI limitations</h2><p>Model-generated material can misunderstand context, infer things the learner did not mean, omit important information, or state false information confidently. TurtleBlock AI is explicitly designed to expose interpretations and uncertainty where possible, but those safeguards are themselves experimental.</p><h2>Learning remains human</h2><p>The project is designed to support construction, inquiry, dialogue, reflection, recursive revision, and continued learning—not to replace teachers, learners, authorship, or human responsibility. The Turtle Charter describes the intended boundary between agent contribution and learner ownership.</p><h2>Third-party platforms</h2><p>Discord, GitHub, Cloudflare, OpenAI or other model providers, Microsoft, Minecraft, and other connected services are independent platforms with their own terms, availability, security, and privacy practices. References to those products do not imply sponsorship or endorsement unless explicitly stated.</p><h2>Minecraft and trademarks</h2><p>Minecraft is a trademark of Microsoft and/or its affiliates. TurtleBlock AI is an independent educational research project and is not presented as an official Minecraft or Microsoft product unless an explicit partnership is stated.</p><h2>Research status</h2><p>Public descriptions of hypotheses, architectures, field tests, or emerging findings should not be read as claims that a formal study has established efficacy. Published research is identified as such on the Research page; current TurtleBlock AI development includes exploratory engineering and research questions still being tested.</p><div class="pills"><button class="pill" data-go="privacy">Privacy</button><button class="pill" data-go="charter">Turtle Charter</button><a class="pill" href="/terms/">Terms of Service</a></div><div class="foot">Disclaimer · experimental project notice</div>`,
 try:()=>`${mark('🧪')}<h1>Talk with Turtle</h1><p class="lede">Describe a place you want to make in Minecraft, then build it through an ongoing conversation with Turtle. Your dialogue becomes a persistent WorldSpec that can be exported into Minecraft as blocks, inhabited, questioned, and revised through more dialogue.</p><div class="loop">idea → Turtle dialogue → WorldSpec → Minecraft blocks → inhabit → notice → revise → build again ↺</div><div class="callout"><div id="conversation" class="conversation"><div class="turn turtle"><strong>🐢 Turtle</strong>What kind of place are you thinking about making in Minecraft? We can talk through what it means and what should matter before we place blocks, then build a version you can enter, inspect, and change.</div></div><div id="conversationmeta" class="conversationmeta">This conversation develops one persistent project toward Minecraft construction. WorldSpec carries the idea between dialogue, block placement, experience, and revision.</div><textarea id="idea" maxlength="4000" wrap="soft" placeholder="Describe a place, world, structure, atmosphere, problem, or idea to build with Turtle…"></textarea><div class="examplebar"><button class="examplebtn" type="button" data-example="village">Abandoned village + light of rebirth</button><button class="examplebtn" type="button" data-example="river">Glowing river + hamburger stand</button><button class="examplebtn" type="button" data-example="school">WPA-era school + preserved city</button></div><label class="consent"><input id="consent" type="checkbox"><span>I understand that my submissions may be retained and used for TurtleBlock AI research, evaluation, improvement, and future training/evaluation datasets under <button class="pill" data-go="privacy">Privacy Notice v0.1</button>. I will not submit personal or sensitive information.</span></label><div class="actions"><button class="primary" id="submit" disabled>Continue with Turtle</button><span class="meta">Dialogue → WorldSpec → Minecraft → reflect → revise ↺</span></div><details id="worldspecpeek" class="worldspecpeek hidden"><summary>Inspect the current WorldSpec</summary><pre id="worldspecoutput"></pre></details></div>`
};
function routeFromPath(){const p=location.pathname.replace(/^\/+|\/+$/g,'');return pages[p]?p:'home'}
function go(route,push=true){if(!pages[route])route='home';content.innerHTML=pages[route]();window.scrollTo({top:0,behavior:'auto'});nav.forEach(b=>b.classList.toggle('active',b.dataset.route===route));const names={home:'TurtleBlock AI',about:'About — TurtleBlock AI',worldspec:'WorldSpec — TurtleBlock AI',charter:'Turtle Charter — TurtleBlock AI',research:'Research — TurtleBlock AI',build:'Build Log — TurtleBlock AI',steamhamlet:'STEAMHAMLET — TurtleBlock AI',reeducation:'RE/EDUCATION — TurtleBlock AI',privacy:'Privacy — TurtleBlock AI',disclaimer:'Disclaimer — TurtleBlock AI',try:'Talk with Turtle — TurtleBlock AI'};document.title=names[route]||'TurtleBlock AI';if(push){const path=route==='home'?'/':`/${route}/`;if(location.pathname!==path)history.pushState({route},'',path)}bindPageActions();if(route==='try')bindTry()}
function bindPageActions(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)))}
nav.forEach(b=>b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.route);if(matchMedia('(max-width:820px)').matches)setMenu(true)}));window.addEventListener('popstate',()=>go(routeFromPath(),false));
function setMenu(compact){navpanel.classList.toggle('compact',compact);panelhead.setAttribute('aria-expanded',String(!compact));menutoggle.textContent=compact?'Menu ▸':'Menu ▾'}function toggleMenu(){if(matchMedia('(max-width:820px)').matches)setMenu(!navpanel.classList.contains('compact'))}panelhead.addEventListener('click',toggleMenu);
function bindTry(){const idea=document.getElementById('idea'),consent=document.getElementById('consent'),submit=document.getElementById('submit'),conversation=document.getElementById('conversation'),conversationmeta=document.getElementById('conversationmeta'),worldspecpeek=document.getElementById('worldspecpeek'),worldspecoutput=document.getElementById('worldspecoutput');document.querySelectorAll('[data-example]').forEach(btn=>btn.addEventListener('click',()=>{idea.value=btn.dataset.example==='village'?villageIdea:btn.dataset.example==='river'?riverIdea:schoolIdea;idea.dispatchEvent(new Event('input'));idea.focus()}));function sessionId(){let id=localStorage.getItem('turtleblock_session');if(!id){id=crypto.randomUUID();localStorage.setItem('turtleblock_session',id)}return id}function sync(){submit.disabled=!consent.checked||idea.value.trim().length<3}function addTurn(actor,text){const div=document.createElement('div');div.className='turn '+actor;const strong=document.createElement('strong');strong.textContent=actor==='learner'?'You':'🐢 Turtle';div.appendChild(strong);div.appendChild(document.createTextNode(text));conversation.appendChild(div);div.scrollIntoView({behavior:'smooth',block:'nearest'})}consent.addEventListener('change',sync);idea.addEventListener('input',sync);idea.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!submit.disabled)submit.click()});submit.addEventListener('click',async()=>{const text=idea.value.trim();if(!text)return;addTurn('learner',text);idea.value='';submit.disabled=true;submit.textContent='Turtle is thinking…';try{const r=await fetch('/api/turtle/converse',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({utterance:text,anonymous_session_id:sessionId(),consent_version:'0.1',worldspec_version:'0.1'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');addTurn('turtle',data.turtle);conversationmeta.textContent=`Turtle Lab ${data.session_id} · WorldSpec ${data.worldspec_id} · revision ${String(data.revision).padStart(4,'0')} · ${data.operational_persistence?'persistent state saved':'server persistence not active'}`;worldspecoutput.textContent=JSON.stringify(data.worldspec,null,2);worldspecpeek.classList.remove('hidden')}catch(e){addTurn('turtle','I hit a system error instead of losing the thread: '+e.message)}finally{submit.textContent='Continue with Turtle';sync();idea.focus()}})}
go(routeFromPath(),false);
</script>
