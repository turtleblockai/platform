<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TurtleBlock AI</title>
  <meta name="description" content="Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b0f0d;--panel:#0f1511;--card:#101712;--border:#26382b;--border2:#36513c;--text:#eef7f0;--muted:#b9c9bc;--soft:#8fae95;--accent:#9fe0ad;--dim:#607565;--footer-h:58px}
    *{box-sizing:border-box}html{background:var(--bg);max-width:100%;overflow-x:hidden;scroll-padding-bottom:calc(var(--footer-h) + 28px)}body{margin:0;background:var(--bg);color:var(--text);max-width:100%;overflow-x:hidden;padding-bottom:calc(var(--footer-h) + 34px)}a{color:var(--accent)}button,input,textarea{font:inherit}
    main{width:min(1160px,calc(100% - 2rem));margin:0 auto;padding:46px 1rem 54px}
    .shell{display:grid;grid-template-columns:minmax(0,720px) 360px;gap:40px;justify-content:center;align-items:start;min-width:0}
    .content{min-width:0;width:100%;min-height:720px}.panel{width:360px;min-width:0;border:1px solid var(--border);border-radius:18px;background:var(--panel);padding:1rem;position:sticky;top:28px}
    .markrow{display:flex;align-items:center;gap:.7rem;min-height:132px}.brandhome{border:0;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:16px;display:block}.brandhome:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.brandmark{width:150px;height:122px;object-fit:contain;display:block}.pageicon{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--border2);border-radius:14px;background:var(--card);font-size:1.7rem}
    h1{margin:.25rem 0 .7rem;font-size:clamp(3rem,6.5vw,5.65rem);letter-spacing:-.055em;line-height:.96;overflow-wrap:anywhere}h2{margin:2rem 0 .55rem;font-size:1.45rem}h3{margin:0 0 .35rem}p,li{color:var(--muted);line-height:1.6;overflow-wrap:anywhere}.lede{margin:0;color:var(--muted);font-size:clamp(1.05rem,2vw,1.42rem);line-height:1.5}
    .actions,.pills{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.25rem}.primary,.secondary,.pill{display:inline-block;padding:.8rem 1.05rem;border-radius:999px;text-decoration:none;font-weight:750}.primary{background:var(--accent);color:var(--bg);border:0;cursor:pointer}.secondary,.pill{border:1px solid var(--border2);color:var(--text);background:transparent;cursor:pointer}.pill{padding:.6rem .85rem;font-size:.92rem}
    .panelhead{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin:.1rem 0 .9rem}.panel h2{margin:0;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}.menutoggle{display:none;border:1px solid var(--border2);background:var(--card);color:var(--text);border-radius:999px;padding:.55rem .8rem;font-weight:800;cursor:pointer}
    .navgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;align-items:stretch;min-width:0}.navcard{display:block;text-align:left;padding:.82rem .9rem;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer;min-height:94px;height:auto;min-width:0;overflow:hidden}.navcard:hover,.navcard.active{border-color:#6fa87a;background:#142019}.navcard strong{display:block;margin-bottom:.16rem;font-size:.96rem;line-height:1.17;overflow-wrap:normal;word-break:normal}.navcard span{display:block;font-size:.74rem;line-height:1.24;color:var(--soft)}
    .status{margin-top:.8rem;padding:.75rem .9rem;border-radius:12px;background:var(--bg);color:#78947e;font-size:.82rem;line-height:1.35}.foot{margin-top:1.4rem;color:var(--dim);font-size:.82rem}
    .loop,.callout,.codebox{margin:1.2rem 0;padding:1rem 1.1rem;border:1px solid var(--border);border-radius:14px;background:var(--card);max-width:100%}.loop,.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8eadb;overflow-wrap:anywhere;white-space:normal}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin:1.2rem 0}.smallcard{min-width:0;padding:1rem;border:1px solid var(--border);border-radius:12px;background:var(--card)}.smallcard p{margin:.35rem 0 0;font-size:.94rem}.stage{padding:.85rem 1rem;border:1px solid var(--border);border-radius:12px;background:var(--card);margin:.7rem 0}.stage strong{display:block;margin-bottom:.2rem}.done{color:var(--accent)}
    textarea{width:100%;min-height:155px;resize:vertical;border:1px solid var(--border2);border-radius:12px;background:var(--bg);color:var(--text);padding:1rem;line-height:1.5}.consent{display:flex;gap:.65rem;align-items:flex-start;margin:1rem 0;color:var(--muted);line-height:1.45}.consent input{margin-top:.25rem}.result{margin-top:1rem}.result pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1rem;color:#d8eadb;max-height:320px;overflow:auto;max-width:100%}.meta{font-size:.86rem;color:#78947e}.error{color:#ffb0b0}.hidden{display:none!important}.fade{animation:fade .16s ease-out}@keyframes fade{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
    .sitefooter{position:fixed;left:0;right:0;bottom:0;z-index:50;min-height:var(--footer-h);border-top:1px solid var(--border);background:rgba(11,15,13,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 1rem 16px;text-align:center;color:var(--dim);font-size:.88rem;max-width:100%;overflow:hidden}.sitefooter nav{display:flex;justify-content:center;align-items:center;gap:.65rem;flex-wrap:wrap}.sitefooter a{color:var(--soft);font-weight:700;text-decoration:none}.sitefooter a:hover{text-decoration:underline}.dot{opacity:.45}
    @media(min-width:821px){html,body{height:100%;overflow:hidden}body{padding-bottom:0}main{height:calc(100vh - var(--footer-h));min-height:0;padding-top:28px;padding-bottom:18px}.shell{height:100%;min-height:0;align-items:stretch}.content{height:100%;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:16px;padding-bottom:64px;scrollbar-gutter:stable}.panel{position:sticky;top:0;align-self:start;height:max-content;max-height:calc(100vh - var(--footer-h) - 46px);overflow-y:auto;overscroll-behavior:contain}}
    @media(max-width:1040px) and (min-width:821px){main{width:min(980px,calc(100% - 1.5rem))}.shell{grid-template-columns:minmax(0,1fr) 300px;gap:22px}.panel{width:300px}.navcard{min-height:82px;padding:.7rem .74rem}.navcard span{font-size:.69rem}.navcard strong{font-size:.89rem}}
    @media(max-width:820px){:root{--footer-h:72px}main{width:100%;max-width:100%;padding:14px 14px 48px}.shell{display:flex;flex-direction:column;gap:1rem;width:100%;max-width:100%;min-width:0}.panel{width:100%;max-width:100%;position:static;order:-1;padding:.75rem;border-radius:16px}.panelhead{margin:0;min-height:48px;cursor:pointer;user-select:none}.menutoggle{display:inline-flex;align-items:center;gap:.35rem;min-height:42px;pointer-events:none}.navgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;padding:.55rem 0 0;overflow:visible;width:100%;max-width:100%}.navcard{width:100%;min-width:0;min-height:50px;padding:.68rem .72rem;border-radius:11px;white-space:normal;text-align:left;display:flex;align-items:center}.navcard strong{margin:0;font-size:.88rem;line-height:1.15}.navcard span{display:none}.panel.compact .navgrid{display:none}.status{display:none}.content{min-height:0;width:100%;max-width:100%;overflow:hidden}.brandmark{width:112px;height:94px}.markrow{min-height:102px}h1{font-size:clamp(2.65rem,13vw,4.2rem);max-width:100%}.lede{font-size:1.08rem}.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){:root{--footer-h:82px}main{padding:10px 12px 46px}.panel{padding:.68rem}.panel h2{font-size:.84rem}.menutoggle{padding:.45rem .68rem;font-size:.8rem}.navgrid{gap:.42rem}.navcard{min-height:48px;padding:.62rem .66rem}.navcard strong{font-size:.82rem}.cards{grid-template-columns:1fr}.shell{gap:.75rem}h1{font-size:clamp(2.45rem,12vw,3.2rem)}.brandmark{width:94px;height:80px}.pageicon{width:40px;height:40px;font-size:1.3rem}.markrow{min-height:86px}.sitefooter{font-size:.78rem;padding:11px 10px 13px}.loop,.callout,.codebox{padding:.9rem}.pills,.actions{gap:.5rem}.pill,.secondary,.primary{max-width:100%;white-space:normal}}
  </style>
</head>
<body>
<main>
  <section class="shell">
    <section id="content" class="content" aria-live="polite"></section>
    <aside class="panel compact" id="navpanel" aria-label="TurtleBlock sections">
      <div class="panelhead" id="panelhead" role="button" tabindex="0" aria-expanded="false" aria-controls="navgrid"><h2>Start here</h2><button class="menutoggle" id="menutoggle" type="button" tabindex="-1">Menu ▸</button></div>
      <div class="navgrid" id="navgrid">
        <button class="navcard" data-route="try"><strong>Try It</strong><span>Playground.</span></button>
        <button class="navcard" data-route="about"><strong>About</strong><span>Why it exists.</span></button>
        <button class="navcard" data-route="worldspec"><strong>WorldSpec</strong><span>Constructible ideas.</span></button>
        <button class="navcard" data-route="charter"><strong>Turtle Charter</strong><span>How Turtle behaves.</span></button>
        <button class="navcard" data-route="research"><strong>Research</strong><span>Lineage.</span></button>
        <button class="navcard" data-route="build"><strong>Build Log</strong><span>Milestones.</span></button>
        <button class="navcard" data-route="steamhamlet"><strong>STEAM<br>HAMLET</strong><span>Earlier work.</span></button>
        <button class="navcard" data-route="reeducation"><strong>RE/<br>EDUCATION</strong><span>Practice + R&amp;D.</span></button>
        <button class="navcard" data-route="privacy"><strong>Privacy</strong><span>Data use.</span></button>
      </div>
      <div class="status">🐢 LLM-backed Turtle dialogue is the current build edge; Minecraft construction follows.</div>
    </aside>
  </section>
</main>
<footer class="sitefooter"><nav aria-label="Creator links"><span>Created and researched by</span><a href="https://www.google.com/search?q=nayrbgo" target="_blank" rel="noopener noreferrer">@nayrbgo</a><span class="dot">•</span><a href="https://github.com/turtleblockai" target="_blank" rel="noopener noreferrer">GitHub</a><span class="dot">•</span><a href="https://orcid.org/0000-0001-6866-7280" target="_blank" rel="me noopener noreferrer" aria-label="ORCID 0000-0001-6866-7280">ORCID</a><span class="dot">•</span><a href="https://read.bryansanders.com" target="_blank" rel="noopener noreferrer">read.bryansanders.com</a></nav></footer>
<script>
const content=document.getElementById('content');const nav=[...document.querySelectorAll('.navcard')];const navpanel=document.getElementById('navpanel');const panelhead=document.getElementById('panelhead');const menutoggle=document.getElementById('menutoggle');
const mark=(icon='🏠')=>`<div class="markrow"><button class="brandhome" data-go="home" aria-label="TurtleBlock AI home"><img class="brandmark" src="/assets/turtleblock-mark.svg" alt="TurtleBlock AI: turtle and bricks on an AI chip"></button><span class="pageicon" aria-label="Current section">${icon}</span></div>`;
const home=`${mark('🏠')}<h1>TurtleBlock AI</h1><p class="lede">Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond.</p><div class="actions"><button class="primary" data-go="try">Try It</button><button class="secondary" data-go="about">What is this?</button><button class="secondary" data-go="build">Build log</button><a class="secondary" href="/lab/">Turtle Lab</a></div><div class="foot">A public educational research playground · building the ship while flying the ship.</div>`;
const pages={
  home:()=>home,
  about:()=>`${mark('❓')}<h1>What is TurtleBlock AI?</h1><p class="lede">A public educational research playground for turning ideas into computational worlds that can be built, inhabited, questioned, broken, revised, and shared.</p><div class="callout"><strong>Building the ship while flying the ship.</strong><p>TurtleBlock AI is both software and inquiry. The platform changes through use, and the process of building it is part of the research.</p></div><h2>Not an AI world vending machine</h2><p>The learner remains the designer and producer. Turtle helps represent, clarify, test, and revise ideas rather than silently replacing them with a finished answer.</p><div class="pills"><button class="pill" data-go="charter">Read the Turtle Charter</button></div>`,
  worldspec:()=>`${mark('📐')}<h1>WorldSpec</h1><p class="lede">The edition-independent representation layer between a learner's idea, a conversation with Turtle, and a world that can be built, inhabited, tested, reflected upon, and revised.</p><div class="loop">learner intent → dialogue → WorldSpec → build → inhabit → notice → reflect → revise ↺</div><div class="cards"><div class="smallcard"><strong>Schema</strong><p>Objects, relationships, form, function, materials, meaning, constraints, reflection, and history.</p></div><div class="smallcard"><strong>Lexicon</strong><p>Construction, inquiry, social, semantic, reflective, uncertainty, and provenance language.</p></div><div class="smallcard"><strong>Grammar + syntax</strong><p>Rules for direct action, interpretation, questions, negation, contradiction, deixis, comparison, and revision.</p></div></div><h2>Hostile data pass</h2><p>WorldSpec tests ambiguous references, contradictions, questions that must not execute, learner-defined meanings, social disagreement, manual edits, unknown values, and deliberately strange language such as “make the castle more Tuesday.”</p><div class="codebox">SPEECH-ACT + ACTION + TARGET + CHANGE + RELATION + CONSTRAINT + MEANING + EPISTEMIC-STATE + REFLECTION</div><div class="pills"><button class="pill" data-go="charter">Turtle Charter</button><a class="pill" href="https://github.com/turtleblockai/platform/tree/main/worldspec" target="_blank">WorldSpec on GitHub</a><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/grammar/syntax.md" target="_blank">Syntax</a></div>`,
  charter:()=>`${mark('📜')}<h1>The Turtle Charter</h1><p class="lede">A living constitution for what Turtle should do, what it should not do, and what must remain in the learner's hands.</p><div class="loop">principle → interpreter rule → WorldSpec representation → hostile test</div><div class="callout"><strong>Turtle may contribute:</strong><p>information, possibilities, patterns, consequences, questions, prototypes, comparisons, and technical assistance.</p><strong>The learner retains:</strong><p>purpose, meaning, judgment, values, ownership, interpretation, decision, and reflection.</p></div><h2>Core commitments</h2><ol><li><strong>Act only when the learner's intent is sufficiently clear.</strong> Ambiguity is not permission to guess.</li><li><strong>Prefer reversible proposals to silent interpretation.</strong> Ask when interpretation would materially determine meaning.</li><li><strong>Suggest sparingly.</strong> Turtle contributions remain visibly distinct from learner decisions.</li><li><strong>Interesting failure is not automatically a bug.</strong> Surface consequences and let learners test viable ideas.</li><li><strong>Social and cultural implications may be surfaced without moralizing.</strong></li><li><strong>Disagreement remains disagreement until learners resolve it.</strong> Turtle does not manufacture consensus.</li><li><strong>Manual edits and accidents are authored state.</strong> They are not noise to overwrite.</li><li><strong>Failure may remain in the world for inspection and reflection.</strong></li><li><strong>Words such as fair, safe, democratic, natural, or beautiful are interpretive terms, not universal parameters.</strong></li><li><strong>Turtle should say when it does not know what the learner means.</strong></li><li><strong>Memory should carry forward relevant learner decisions, definitions, reflections, and contradictions.</strong></li><li><strong>Turtle does not silently choose the learner's purpose, values, final aesthetic judgment, or resolution of meaningful disagreement.</strong></li></ol><h2>Harder edges</h2><p>Turtle may challenge a premise as a collaborator, introduce productive friction by surfacing contradictions, remind learners when a new move conflicts with a prior intention, suggest experiments instead of answers, and deliberately leave something unresolved when resolution would terminate productive inquiry.</p><div class="codebox">When an answer would terminate productive inquiry, Turtle may propose: BUILD IT AND SEE.</div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform/blob/main/worldspec/TURTLE_CHARTER.md" target="_blank">Full charter on GitHub</a><button class="pill" data-go="worldspec">WorldSpec</button></div>`,
  research:()=>`${mark('🔬')}<h1>Research lineage</h1><p class="lede">TurtleBlock AI is a live implementation space for a longer line of educational research centered on learner agency, inquiry, construction, collaboration, reflection, and computers as environments for thinking.</p><div class="loop">Critical Techno Constructivism → STEAMHAMLET → Minecraft learning environments → co-active emergence → TurtleBlock AI</div><h2>Research as public construction</h2><p>WorldSpec, Turtle, the Minecraft adapters, and the Playground are revised through use. The codebase and website function as both software and research notebook.</p><div class="pills"><button class="pill" data-go="charter">Turtle Charter</button><a class="pill" href="https://steamhamlet.com" target="_blank">STEAMHAMLET archive</a></div>`,
  build:()=>`${mark('🔧')}<h1>Build Log</h1><p class="lede">The code, mistakes, revisions, research questions, and changing architecture stay visible.</p><div class="stage"><strong class="done">✓ Public platform</strong><p>GitHub organization, Cloudflare deployment, turtleblockai.com, health endpoint, persistent navigation shell, and project pages.</p></div><div class="stage"><strong class="done">✓ WorldSpec v0.1</strong><p>Schema, expanded lexicon, grammar, syntax, hostile cases, example, deterministic interpreter, and Turtle Charter.</p></div><div class="stage"><strong class="done">✓ Discord Turtle v0.1</strong><p>The /turtle command completes the Discord → Worker → Turtle loop. LLM-backed opening dialogue is wired with deterministic fallback and prompt-injection trust boundaries.</p></div><div class="stage"><strong>→ Current edge</strong><p>Persist Turtle Lab sessions and WorldSpec revisions, deepen LLM semantic capture, create conversational Discord threads, then connect the first Minecraft adapter.</p></div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform" target="_blank">Public repository</a><a class="pill" href="/lab/">Turtle Lab</a></div>`,
  steamhamlet:()=>`${mark('🌀')}<h1>STEAMHAMLET → TurtleBlock AI</h1><p class="lede">STEAMHAMLET is the earlier room of possibilities behind TurtleBlock AI: a shared environment where ideas and informational objects can be moved, changed, scaled, remixed, juxtaposed, tested, and revised.</p><p>TurtleBlock AI gives that long-running vision an executable playground through conversational agents, WorldSpec, Minecraft, and a public build process.</p><div class="loop">Critical Techno Constructivism → STEAMHAMLET → Minecraft → co-active emergence → TurtleBlock AI</div><div class="pills"><button class="pill" data-go="charter">Turtle Charter</button><a class="pill" href="https://steamhamlet.com" target="_blank">Open STEAMHAMLET</a></div>`,
  reeducation:()=>`${mark('🏫')}<h1>TurtleBlock AI + RE/EDUCATION</h1><p class="lede">TurtleBlock AI is being developed as part of the educational practice, research, and school-building work of <a href="https://reeducationllc.com" target="_blank">RE/EDUCATION</a>.</p><div class="callout"><strong>A school can also be a laboratory.</strong><p>TurtleBlock AI provides a place to design, test, revise, and study new forms of learner-centered computational experience while those experiences are being built.</p></div><h2>Credentialed practice meets research</h2><p>The project connects day-to-day work as a credentialed educator with longer-running doctoral and post-doctoral inquiry into constructivism, constructionism, digital learning environments, Minecraft, machine intelligence, and co-active emergence.</p><div class="pills"><button class="pill" data-go="charter">Turtle Charter</button><a class="pill" href="https://reeducationllc.com" target="_blank">Visit RE/EDUCATION</a></div>`,
  privacy:()=>`${mark('🔐')}<h1>Playground Privacy</h1><p class="lede">TurtleBlock AI is an experimental educational research and development project.</p><h2>What happens to submissions</h2><p>Text submitted through the Playground may be retained and analyzed to operate, evaluate, research, develop, and improve TurtleBlock AI, WorldSpec, related educational tools, and future research or training datasets.</p><h2>Do not submit personal or sensitive information</h2><p>Please do not submit passwords, financial information, medical information, confidential school records, private communications, or information about other people that you do not have permission to share.</p><h2>Review and filtering</h2><p>Before material is incorporated into a research, evaluation, or training dataset, TurtleBlock AI intends to use automated and, where appropriate, human review to identify and remove or exclude personal, sensitive, unsafe, offensive, or irrelevant content. These processes are not perfect.</p><h2>Anonymous sessions</h2><p>The public Playground does not require identification. A random browser session identifier may connect related revisions. TurtleBlock AI does not intentionally collect or store IP addresses as part of the Playground research dataset.</p><div class="foot">Privacy version 0.1 · August 2026</div>`,
  try:()=>`${mark('🧪')}<h1>Try It</h1><p class="lede">Describe something you want to make, change, test, or understand. This experimental version interprets your language into a revisable WorldSpec proposal; it does not build Minecraft yet.</p><div class="callout"><textarea id="idea" maxlength="4000" placeholder="Example: Make a small village on a hill where the houses share a central garden, but keep the paths irregular and make the entrance feel welcoming."></textarea><label class="consent"><input id="consent" type="checkbox"><span>I understand that my submission may be retained and used for TurtleBlock AI research, evaluation, improvement, and future training/evaluation datasets under <button class="pill" data-go="privacy">Privacy Notice v0.1</button>. I will not submit personal or sensitive information.</span></label><div class="actions"><button class="primary" id="submit" disabled>Build with Turtle</button><span class="meta">WorldSpec v0.1 · experimental</span></div><div class="result hidden" id="result"><h2>Turtle interpretation</h2><pre id="output"></pre><div id="persist" class="meta"></div></div></div>`
};
function routeFromPath(){const p=location.pathname.replace(/^\/+|\/+$/g,'');return pages[p]?p:'home'}
function go(route,push=true){if(!pages[route])route='home';content.classList.remove('fade');content.innerHTML=pages[route]();void content.offsetWidth;content.classList.add('fade');nav.forEach(b=>b.classList.toggle('active',b.dataset.route===route));const names={worldspec:'WorldSpec',reeducation:'RE/EDUCATION',steamhamlet:'STEAMHAMLET',charter:'Turtle Charter'};document.title=route==='home'?'TurtleBlock AI':`${names[route]||route[0].toUpperCase()+route.slice(1)} — TurtleBlock AI`;if(push){const path=route==='home'?'/':`/${route}/`;if(location.pathname!==path)history.pushState({route},'',path)}bindPageActions();if(route==='try')bindTry()}
function bindPageActions(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)))}
nav.forEach(b=>b.addEventListener('click',()=>{go(b.dataset.route);if(matchMedia('(max-width:820px)').matches)setMenu(true)}));window.addEventListener('popstate',()=>go(routeFromPath(),false));
function setMenu(compact){navpanel.classList.toggle('compact',compact);panelhead.setAttribute('aria-expanded',String(!compact));menutoggle.textContent=compact?'Menu ▸':'Menu ▾'}
function toggleMenu(){if(!matchMedia('(max-width:820px)').matches)return;setMenu(!navpanel.classList.contains('compact'))}
panelhead.addEventListener('click',toggleMenu);panelhead.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMenu()}});
function bindTry(){const idea=document.getElementById('idea'),consent=document.getElementById('consent'),submit=document.getElementById('submit'),result=document.getElementById('result'),output=document.getElementById('output'),persist=document.getElementById('persist');function sessionId(){let id=localStorage.getItem('turtleblock_session');if(!id){id=crypto.randomUUID();localStorage.setItem('turtleblock_session',id)}return id}function sync(){submit.disabled=!consent.checked||idea.value.trim().length<3}consent.addEventListener('change',sync);idea.addEventListener('input',sync);submit.addEventListener('click',async()=>{submit.disabled=true;submit.textContent='Thinking with it…';result.classList.remove('hidden');output.className='';output.textContent='';persist.textContent='';try{const r=await fetch('/api/worldspec/interpret',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({utterance:idea.value.trim(),anonymous_session_id:sessionId(),consent_version:'0.1',worldspec_version:'0.1'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');output.textContent=JSON.stringify(data.interpretation,null,2);persist.textContent=data.persistence?.stored?'Submission stored for research review.':'Interpretation worked; research persistence is not configured yet.'}catch(e){output.textContent='Error: '+e.message;output.className='error'}finally{submit.textContent='Build with Turtle';sync()}})}
go(routeFromPath(),false);
</script>
</body>
</html>
