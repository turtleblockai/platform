  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b0f0d;--panel:#0f1511;--card:#101712;--border:#26382b;--border2:#36513c;--text:#eef7f0;--muted:#b9c9bc;--soft:#8fae95;--accent:#9fe0ad;--dim:#607565;--footer-h:58px}
    *{box-sizing:border-box}html{background:var(--bg);max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);max-width:100%;overflow-x:hidden;padding-bottom:calc(var(--footer-h) + 34px)}a{color:var(--accent)}button,input,textarea{font:inherit}
    main{width:min(1160px,calc(100% - 2rem));margin:0 auto;padding:46px 1rem 54px}.shell{display:grid;grid-template-columns:minmax(0,800px) 288px;gap:32px;justify-content:center;align-items:start;min-width:0}.content{min-width:0;width:100%;min-height:720px}.panel{width:288px;min-width:0;border:1px solid var(--border);border-radius:16px;background:var(--panel);padding:.82rem;position:sticky;top:28px}
    .markrow{display:flex;align-items:center;gap:.7rem;min-height:132px}.brandhome{border:0;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:16px;display:block}.brandmark{width:150px;height:122px;object-fit:contain;display:block}.pageicon{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--border2);border-radius:14px;background:var(--card);font-size:1.7rem}
    h1{margin:.25rem 0 .7rem;font-size:clamp(3rem,6.5vw,5.65rem);letter-spacing:-.055em;line-height:.96;overflow-wrap:anywhere}h2{margin:2rem 0 .55rem;font-size:1.45rem}h3{margin:0 0 .4rem}p,li{color:var(--muted);line-height:1.6}.lede{margin:0;color:var(--muted);font-size:clamp(1.05rem,2vw,1.42rem);line-height:1.5}.actions,.pills{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.25rem}.primary,.secondary,.pill{display:inline-block;padding:.8rem 1.05rem;border-radius:999px;text-decoration:none;font-weight:750}.primary{background:var(--accent);color:var(--bg);border:0;cursor:pointer}.secondary,.pill{border:1px solid var(--border2);color:var(--text);background:transparent;cursor:pointer}.pill{padding:.6rem .85rem;font-size:.92rem}
    .panelhead{display:flex;align-items:center;justify-content:space-between;gap:.65rem;margin:.05rem 0 .72rem}.panel h2{margin:0;font-size:.88rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}.menutoggle{display:none;border:1px solid var(--border2);background:var(--card);color:var(--text);border-radius:999px;padding:.5rem .7rem;font-weight:800;cursor:pointer}.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:.52rem;align-items:stretch;min-width:0}.navcard{display:block;text-align:left;padding:.66rem .7rem;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);cursor:pointer;min-height:76px;height:auto;min-width:0;overflow:hidden;text-decoration:none}.navcard:hover,.navcard.active{border-color:#6fa87a;background:#142019}.navcard strong{display:block;margin-bottom:.12rem;font-size:.86rem;line-height:1.12;overflow-wrap:normal;word-break:normal}.navcard span{display:block;font-size:.67rem;line-height:1.2;color:var(--soft)}
    .status{margin-top:.66rem;padding:.65rem .72rem;border-radius:11px;background:var(--bg);color:#78947e;font-size:.74rem;line-height:1.3}.foot{margin-top:1.4rem;color:var(--dim);font-size:.82rem}.loop,.callout,.codebox,.stage,.pub{margin:1.2rem 0;padding:1rem 1.1rem;border:1px solid var(--border);border-radius:14px;background:var(--card);max-width:100%;min-width:0}.loop,.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8eadb;overflow-wrap:anywhere;white-space:normal}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin:1.2rem 0}.smallcard{min-width:0;padding:1rem;border:1px solid var(--border);border-radius:12px;background:var(--card)}.smallcard p{margin:.35rem 0 0;font-size:.94rem}.stage strong,.pub strong{display:block;margin-bottom:.2rem}.done{color:var(--accent)}.date{color:var(--dim);font-size:.8rem}.pullquote{margin:1.2rem 0;padding:1.15rem 1.2rem;border-left:3px solid #6fa87a;background:#0f1511;border-radius:0 12px 12px 0;color:#d8eadb;font-size:1.15rem;line-height:1.55}.cite{display:block;margin-top:.55rem;color:var(--soft);font-size:.82rem}.pub h3{color:var(--text)}
    textarea{display:block;width:100%;max-width:100%;min-width:0;min-height:155px;resize:vertical;border:1px solid var(--border2);border-radius:12px;background:var(--bg);color:var(--text);padding:1rem;line-height:1.5;overflow-x:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.examplebar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.75rem 0 .2rem}.examplebtn{border:1px solid var(--border2);background:transparent;color:var(--soft);border-radius:999px;padding:.5rem .7rem;cursor:pointer;font-size:.82rem}.examplebtn:hover{color:var(--text);border-color:#6fa87a}.consent{display:flex;gap:.65rem;align-items:flex-start;margin:1rem 0;color:var(--muted);line-height:1.45}.consent input{margin-top:.25rem}.result{margin-top:1rem}.result pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1rem;color:#d8eadb;max-height:320px;overflow:auto;max-width:100%}.meta{font-size:.86rem;color:#78947e}.error{color:#ffb0b0}.hidden{display:none!important}
    .sitefooter{position:fixed;left:0;right:0;bottom:0;z-index:50;min-height:var(--footer-h);border-top:1px solid var(--border);background:rgba(11,15,13,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 1rem 16px;text-align:center;color:var(--dim);font-size:.88rem;max-width:100%;overflow:hidden}.sitefooter nav{display:flex;justify-content:center;align-items:center;gap:.65rem;flex-wrap:wrap}.sitefooter a{color:var(--soft);font-weight:700;text-decoration:none}.dot{opacity:.45}
    @media(min-width:821px){html,body{height:100%;overflow:hidden}body{padding-bottom:0}main{height:calc(100vh - var(--footer-h));min-height:0;padding-top:28px;padding-bottom:18px}.shell{height:100%;min-height:0;align-items:stretch}.content{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:16px;padding-bottom:64px;scrollbar-gutter:stable}.panel{position:sticky;top:0;align-self:start;height:max-content;max-height:calc(100vh - var(--footer-h) - 46px);overflow-y:auto}}
    @media(max-width:1040px) and (min-width:821px){main{width:min(980px,calc(100% - 1.5rem))}.shell{grid-template-columns:minmax(0,1fr) 250px;gap:20px}.panel{width:250px}.navcard{min-height:70px;padding:.58rem .62rem}.navcard span{font-size:.63rem}.navcard strong{font-size:.8rem}}
    @media(max-width:820px){:root{--footer-h:72px}main{width:100%;max-width:100%;padding:14px 14px 48px}.shell{display:flex;flex-direction:column;gap:1rem;width:100%;max-width:100%;min-width:0}.panel{width:100%;max-width:100%;position:static;order:-1;padding:.75rem}.panelhead{margin:0;min-height:48px;cursor:pointer}.menutoggle{display:inline-flex}.navgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;padding:.55rem 0 0}.navcard{min-height:50px;padding:.68rem .72rem;display:flex;align-items:center}.navcard strong{margin:0;font-size:.88rem}.navcard span{display:none}.panel.compact .navgrid{display:none}.status{display:none}.content{min-height:0;width:100%;max-width:100%;overflow:hidden}.brandmark{width:112px;height:94px}.markrow{min-height:102px}.cards{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){:root{--footer-h:82px}main{padding:10px 12px 46px}.cards{grid-template-columns:1fr}.brandmark{width:94px;height:80px}.pageicon{width:40px;height:40px;font-size:1.3rem}.sitefooter{font-size:.78rem;padding:11px 10px 13px}}
  </style>

<main><section class="shell"><section id="content" class="content" aria-live="polite"></section><aside class="panel compact" id="navpanel" aria-label="TurtleBlock sections"><div class="panelhead" id="panelhead" role="button" tabindex="0" aria-expanded="false"><h2>Start here</h2><button class="menutoggle" id="menutoggle" type="button" tabindex="-1">Menu ▸</button></div><div class="navgrid" id="navgrid">
<button class="navcard" data-route="try"><strong>Try It</strong><span>Playground.</span></button><button class="navcard" data-route="about"><strong>About</strong><span>Why it exists.</span></button><button class="navcard" data-route="worldspec"><strong>WorldSpec</strong><span>Constructible ideas.</span></button><button class="navcard" data-route="charter"><strong>Turtle Charter</strong><span>How Turtle behaves.</span></button><button class="navcard" data-route="research"><strong>Research</strong><span>Writing + lineage.</span></button><button class="navcard" data-route="build"><strong>Build Log</strong><span>Running history.</span></button><a class="navcard" href="/lab/"><strong>Turtle Lab</strong><span>Public artifacts.</span></a><button class="navcard" data-route="steamhamlet"><strong>STEAM<br>HAMLET</strong><span>Earlier work.</span></button><button class="navcard" data-route="reeducation"><strong>RE/<br>EDUCATION</strong><span>Practice + R&amp;D.</span></button><button class="navcard" data-route="privacy"><strong>Privacy</strong><span>Data use.</span></button>
</div><div class="status">🐢 LLM-backed Turtle dialogue is the current build edge; Minecraft construction follows.</div></aside></section></main>
<footer class="sitefooter"><nav aria-label="Creator links"><span>Created and researched by</span><a href="https://www.google.com/search?q=nayrbgo" target="_blank" rel="noopener noreferrer">@nayrbgo</a><span class="dot">•</span><a href="https://github.com/turtleblockai" target="_blank" rel="noopener noreferrer">GitHub</a><span class="dot">•</span><a href="https://orcid.org/0000-0001-6866-7280" target="_blank" rel="me noopener noreferrer">ORCID</a><span class="dot">•</span><a href="https://read.bryansanders.com" target="_blank" rel="noopener noreferrer">read.bryansanders.com</a></nav></footer>
<script>
const content=document.getElementById('content'),nav=[...document.querySelectorAll('[data-route]')],navpanel=document.getElementById('navpanel'),panelhead=document.getElementById('panelhead'),menutoggle=document.getElementById('menutoggle');
const mark=(icon='🏠')=>`<div class="markrow"><button class="brandhome" data-go="home" aria-label="TurtleBlock AI home"><img class="brandmark" src="/assets/turtleblock-mark.svg" alt="TurtleBlock AI turtle and bricks on an AI chip"></button><span class="pageicon">${icon}</span></div>`;
const home=`${mark('🏠')}<h1>TurtleBlock AI</h1><p class="lede">Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond.</p><div class="actions"><button class="primary" data-go="try">Try It</button><a class="secondary" href="/lab/">Turtle Lab</a><button class="secondary" data-go="research">Research</button><button class="secondary" data-go="build">Build log</button></div><div class="foot">A public educational research playground · building the ship while flying the ship.</div>`;
const villageIdea=`I want to make an abandoned village that has clear structures that are in disarray but were once nice, and then in the corner somewhere of the village a little shining light of hope of rebirth.`;
const riverIdea=`Let's make a river that has glowing deep depths and a fishing pier with a hamburger stand.`;
const pages={
 home:()=>home,
 about:()=>`${mark('❓')}<h1>What is TurtleBlock AI?</h1><p class="lede">A public educational research playground for turning ideas into computational worlds that can be built, inhabited, questioned, broken, revised, and shared.</p><div class="callout"><strong>Not an AI world vending machine.</strong><p>The learner remains the designer and producer. Turtle helps represent, clarify, test, and revise ideas rather than silently replacing them with a finished answer.</p></div><h2>Building in public</h2><p>The software, research questions, failures, revisions, and emerging pedagogy remain visible as the platform develops.</p>`,
 worldspec:()=>`${mark('📐')}<h1>WorldSpec</h1><p class="lede">The representation layer between a learner's idea, a conversation with Turtle, and a world that can be built, inhabited, tested, reflected upon, and revised.</p><div class="loop">learner intent → dialogue → WorldSpec → build → inhabit → notice → reflect → revise ↺</div><div class="cards"><div class="smallcard"><strong>Lossless first</strong><p>Preserve learner language before normalization.</p></div><div class="smallcard"><strong>Revisable</strong><p>Each dialogue turn may update the same persistent WorldSpec.</p></div><div class="smallcard"><strong>Inspectable</strong><p>Meaning, uncertainty, assumptions, and provenance remain visible.</p></div></div>`,
 charter:()=>`${mark('📜')}<h1>The Turtle Charter</h1><p class="lede">A living constitution for what Turtle should do, what it should not do, and what must remain in the learner's hands.</p><div class="callout"><strong>Turtle may contribute:</strong><p>information, possibilities, patterns, consequences, questions, prototypes, comparisons, and technical assistance.</p><strong>The learner retains:</strong><p>purpose, meaning, judgment, values, ownership, interpretation, decision, and reflection.</p></div><div class="codebox">When an answer would terminate productive inquiry, Turtle may propose: BUILD IT AND SEE.</div>`,
 research:()=>`${mark('🔬')}<h1>Research</h1><p class="lede">Read downward and a four-decade argument emerges: wonder matters; learners should make; environments should provoke inquiry; ideas should become visible; people and machines should enter dialogue; and technology should enlarge rather than replace human thought. TurtleBlock AI is the newest implementation of that continuing research program.</p><div class="loop">wonder → making → agency → environment → dialogue → visible ideas → human + machine → TurtleBlock AI</div><h2>1983 · Wonder becomes construction 🐢</h2><div class="pub"><h3>The First Thing I Did With A Computer</h3><p>Published in 2023 in <em>Twenty Things to Do with a Computer Forward 50</em> (CMK Press). The origin story begins in elementary school with an Apple ][, Logo, and a mysterious turtle whose movement made computation visible.</p><div class="pullquote">“that traveling triangle that drew shapes on the screen had me wondering”<span class="cite">— Sanders, <em>The First Thing I Did With A Computer</em></span></div><div class="pullquote">“Kids started asking other kids how to write commands”<span class="cite">— Sanders, <em>The First Thing I Did With A Computer</em></span></div><p>Wonder became making; making became peer teaching; peer teaching became collaborative programming. TurtleBlock AI deliberately returns to that first computational creature—not as nostalgia, but as a model of an object-to-think-with.</p><div class="pills"><a class="pill" href="https://www.researchgate.net/publication/376893864_The_First_Thing_I_Did_With_A_Computer" target="_blank" rel="noopener noreferrer">Read the Logo reflection</a></div></div><h2>2019 · Purpose before automation</h2><div class="pub"><h3>Toward a Unified Computer Learning Theory: Critical Techno Constructivism</h3><p>Ed.D. dissertation, Loyola Marymount University. The doctoral framework asks schools to stop treating computers as delivery machines and instead create conditions for inquiry, agency, collaboration, transformation, and critically conscious participation.</p><div class="pullquote">“something greater than themselves or the coursework”<span class="cite">— Sanders, <em>Critical Techno Constructivism</em> (2019)</span></div><div class="pullquote">“deeply and purposefully, mix up electronics with people”<span class="cite">— Sanders, <em>Critical Techno Constructivism</em> (2019)</span></div><p>Those two ideas now sit underneath TurtleBlock AI: computational work should have human purpose, and the important design problem is not the machine alone but the relationship created when people and machines are purposefully mixed.</p><div class="pills"><a class="pill" href="https://digitalcommons.lmu.edu/etd/901/" target="_blank" rel="noopener noreferrer">Read at LMU</a></div></div><h2>2021 · The environment becomes the curriculum</h2><div class="pub"><h3>Could Minecraft Be a School?</h3><p>Published in Springer's <em>Game-based Learning Across the Disciplines</em>. Minecraft is treated not as another instructional application but as a persistent environment where learner action, conflict, collaboration, and discovery can generate curriculum.</p><div class="pullquote">“reject the worksheet and instead take control of their own minds”<span class="cite">— Sanders, <em>Could Minecraft Be a School?</em> (2021)</span></div><div class="pullquote">“dialogue and questions naturally occurring among students will create a curriculum”<span class="cite">— Sanders, <em>Could Minecraft Be a School?</em> (2021)</span></div><p>That move—from prescribed lesson to generative environment—is exactly what WorldSpec and the Turtle conversation layer are meant to preserve.</p><div class="pills"><a class="pill" href="https://doi.org/10.1007/978-3-030-75142-5_17" target="_blank" rel="noopener noreferrer">Springer / DOI</a></div></div><h2>2022 · Dialogue rebuilds learning</h2><div class="pub"><h3>Purposeful Play – Educating with Minecraft</h3><p>Published by Minecraft Education. Here the learner-centered environment becomes pedagogical practice: authentic problems emerge during play, students ask what they need to know, and teachers join them inside the inquiry.</p><div class="pullquote">“Students and teachers enter a dialogue and co-construct the class curriculum.”<span class="cite">— Sanders, Minecraft Education (2022)</span></div><div class="pullquote">“we can rebuild learning”<span class="cite">— Sanders, Minecraft Education (2022)</span></div><p>Turtle's Charter extends this same relationship. The agent should not own the curriculum; it should participate in the dialogue through which curriculum emerges.</p><div class="pills"><a class="pill" href="https://education.minecraft.net/en-us/blog/purposeful-play" target="_blank" rel="noopener noreferrer">Read at Minecraft Education</a></div></div><h2>2051 imagined · Ideas become objects</h2><div class="pub"><h3>Vignette: STEAMHAMLET Is School 2051</h3><p>Published in the Springer volume <em>Artificial Intelligence, Human Agency and the Educational Leader</em>. The imagined classroom is student-centered, multidisciplinary, human-and-machine blended, conversational, and capable of turning ideas into manipulable objects.</p><div class="pullquote">“It is a room of possibilities.”<span class="cite">— Sanders, <em>STEAMHAMLET Is School 2051</em></span></div><div class="pullquote">“The room learns as it receives input.”<span class="cite">— Sanders, <em>STEAMHAMLET Is School 2051</em></span></div><p>WorldSpec now makes that vision surprisingly literal: language becomes structured but revisable objects, conversations modify them, and eventually those objects become inhabitable worlds.</p><div class="pills"><a class="pill" href="https://www.researchgate.net/publication/376893403_STEAMHAMLET_is_school_2051" target="_blank" rel="noopener noreferrer">Read the vignette</a><a class="pill" href="https://steamhamlet.com" target="_blank" rel="noopener noreferrer">STEAMHAMLET archive</a></div></div><h2>2023 · The dam has burst</h2><div class="pub"><h3>Engaging with AI — A Radical Shift for the Future, Today</h3><p>Published in <em>California English</em>, Vol. 29, No. 2. The argument shifts from preventing access to computational answers toward learning how to engage those answers critically and collaboratively.</p><div class="pullquote">“the dam has burst”<span class="cite">— Sanders, <em>California English</em> (2023)</span></div><div class="pullquote">“what does it look like to teach and learn and collaborate in the Age of AI?”<span class="cite">— Sanders, <em>California English</em> (2023)</span></div><p>The question is no longer whether the machine enters the intellectual environment. The design problem is what kind of relationship we construct once it is there.</p><div class="pills"><a class="pill" href="https://www.cateweb.org/journals/november-2023/" target="_blank" rel="noopener noreferrer">California English issue</a><a class="pill" href="https://www.researchgate.net/publication/375769340_Engaging_with_AI_--_A_radical_shift_for_the_future_today_It's_already_yesterday" target="_blank" rel="noopener noreferrer">Article copy</a></div></div><h2>2025 · Co-active emergence</h2><div class="pub"><h3>GPT and Me, An Honest Reevaluation: The Dawn of Co-active Emergence</h3><p>Published in <em>Impacting Education</em>. The machine is no longer merely environment or tool: purposeful human-machine dialogue itself becomes an intellectual process capable of producing ideas neither participant would necessarily reach alone.</p><div class="pullquote">“human intelligence and machine intelligence converge on purpose”<span class="cite">— Sanders, <em>The Dawn of Co-active Emergence</em> (2025)</span></div><div class="pullquote">“This is not a copy/paste model”<span class="cite">— Sanders, <em>The Dawn of Co-active Emergence</em> (2025)</span></div><p>That distinction is foundational to TurtleBlock AI. Turtle should be a companion collaborator and critical sounding board—not an answer vending machine and not a substitute author.</p><div class="pills"><a class="pill" href="https://impactinged.pitt.edu/ojs/ImpactingEd/article/view/479" target="_blank" rel="noopener noreferrer">Read the article</a></div></div><h2>2026 · The argument becomes executable</h2><div class="callout"><strong>TurtleBlock AI</strong><p>The current platform brings these strands together: the Logo turtle's inspectable action, Critical Techno Constructivism's learner agency, Minecraft's persistent learning environment, Purposeful Play's emergent curriculum, STEAMHAMLET's manipulable ideas, and co-active emergence's purposeful human-machine dialogue.</p><div class="loop">learner language → Turtle dialogue → persistent WorldSpec → construction → inhabitation → consequence → reflection → revision ↺</div><p>The latest implementation question is no longer merely what these ideas mean. It is whether we can build the infrastructure that lets learners live them.</p></div><div class="pills"><a class="pill" href="https://scholar.google.com/scholar?q=%22Bryan+P.+Sanders%22+education" target="_blank" rel="noopener noreferrer">Google Scholar</a><a class="pill" href="https://orcid.org/0000-0001-6866-7280" target="_blank" rel="noopener noreferrer">ORCID</a><a class="pill" href="https://read.bryansanders.com" target="_blank" rel="noopener noreferrer">More writing</a></div>`,
 build:()=>`${mark('🔧')}<h1>Build Log</h1><p class="lede">A running history of the code, mistakes, reversals, research questions, and architecture. New milestones append; older ones stay visible.</p><div class="stage"><span class="date">Aug 30–31, 2026</span><strong class="done">✓ Public platform foundation</strong><p>GitHub organization, Cloudflare deployment, turtleblockai.com, public shell, health endpoint, project pages, privacy and terms scaffolding.</p></div><div class="stage"><span class="date">Aug 31, 2026</span><strong class="done">✓ WorldSpec v0.1</strong><p>Schema, lexicon, grammar, syntax, hostile cases, deterministic interpreter, and Turtle Charter.</p></div><div class="stage"><span class="date">Aug 31–Sep 1, 2026</span><strong class="done">✓ Discord Turtle installed</strong><p>TurtleBlock AI app created, installed in STEAMHAMLET, and /turtle registered for the guild.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ First Discord → WorldSpec flight</strong><p>A learner idea reached the Worker, generated a WorldSpec preview, received a Minecraft handoff ID, and returned to Discord.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Lossless dialogue architecture</strong><p>Shifted from keyword-first parsing toward persistent conversational Turtle sessions where learner language is preserved before normalization.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ LLM/RAG/security architecture</strong><p>Defined trusted Turtle Charter instructions, bounded retrieval, untrusted learner/RAG data, structured WorldSpec deltas, and deterministic action validation.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ LLM-backed opening dialogue wired</strong><p>/turtle can acknowledge immediately, call the conversational model layer, then replace the waiting Discord response while retaining deterministic fallback.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Turtle Lab publication model</strong><p>Private conversation by default; learner-selected public artifacts, WorldSpec snapshots, outputs, reflections, and selected dialogue may later feed Turtle Lab.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Persistent-state schema designed</strong><p>Turtle sessions, turns, WorldSpec revisions, and publication records defined for D1.</p></div><div class="stage"><span class="date">Sep 2, 2026</span><strong class="done">✓ Research lineage made executable and public</strong><p>Published work on Critical Techno Constructivism, Minecraft as school, purposeful play, STEAMHAMLET, AI engagement, and co-active emergence is now explicitly connected to the live TurtleBlock architecture.</p></div><div class="stage"><span class="date">Current edge</span><strong>→ Persistent conversation</strong><p>Activate D1 in production, create Discord Turtle Lab threads, continue ordinary dialogue inside the same session, retrieve the evolving WorldSpec, and persist revision 0002, 0003, and beyond.</p></div><div class="stage"><span class="date">Next</span><strong>→ Minecraft adapter</strong><p>Translate validated WorldSpec operations into the first controlled Minecraft construction bridge, then feed world changes and learner reactions back into the same project history.</p></div><div class="pills"><a class="pill" href="https://github.com/turtleblockai/platform" target="_blank" rel="noopener noreferrer">Public repository</a><a class="pill" href="/lab/">Turtle Lab</a></div>`,
 steamhamlet:()=>`${mark('🌀')}<h1>STEAMHAMLET → TurtleBlock AI</h1><p class="lede">STEAMHAMLET is the earlier room of possibilities behind TurtleBlock AI: ideas and informational objects can be moved, changed, scaled, remixed, juxtaposed, tested, and revised.</p><div class="loop">Critical Techno Constructivism → STEAMHAMLET → Minecraft learning environments → co-active emergence → TurtleBlock AI</div><h2>Same underlying question</h2><p>What happens when the computer stops behaving mainly like a delivery machine and instead becomes a place to think, construct, collaborate, encounter consequences, and revise?</p><div class="pills"><a class="pill" href="https://steamhamlet.com" target="_blank" rel="noopener noreferrer">Open STEAMHAMLET</a></div>`,
 reeducation:()=>`${mark('🏫')}<h1>TurtleBlock AI + RE/EDUCATION</h1><p class="lede">TurtleBlock AI is being developed as part of educational practice, research, and school-building work.</p><div class="callout"><strong>A school can also be a laboratory.</strong><p>The project connects credentialed educational practice with doctoral and post-doctoral inquiry into constructivism, constructionism, digital learning environments, Minecraft, AI, and co-active emergence.</p></div>`,
 privacy:()=>`${mark('🔐')}<h1>Playground Privacy</h1><p class="lede">TurtleBlock AI is an experimental educational research and development project.</p><h2>Private by default</h2><p>Public Turtle Lab artifacts require an intentional publication step. Raw Discord conversations are not automatically published.</p><h2>Research use</h2><p>Playground submissions may be retained for evaluation and research when the applicable consent flow says so. Sensitive or personal material should not be submitted.</p>`,
 try:()=>`${mark('🧪')}<h1>Try It</h1><p class="lede">Describe something you want to make, change, test, or understand. Turtle begins turning your language into a revisable WorldSpec proposal; it does not build Minecraft yet.</p><div class="callout"><textarea id="idea" maxlength="4000" wrap="soft" placeholder="Try one of the field-test ideas below, or write your own."></textarea><div class="examplebar"><button class="examplebtn" type="button" data-example="village">Abandoned village + light of rebirth</button><button class="examplebtn" type="button" data-example="river">Glowing river + hamburger stand</button></div><label class="consent"><input id="consent" type="checkbox"><span>I understand that my submission may be retained and used for TurtleBlock AI research, evaluation, improvement, and future training/evaluation datasets under <button class="pill" data-go="privacy">Privacy Notice v0.1</button>. I will not submit personal or sensitive information.</span></label><div class="actions"><button class="primary" id="submit" disabled>Build with Turtle</button><span class="meta">WorldSpec v0.1 · experimental</span></div><div class="result hidden" id="result"><h2>What Turtle is seeing</h2><p class="meta">This is the structured interpretation layer—not hidden chain-of-thought. It shows the concepts Turtle is attempting to preserve before dialogue and construction.</p><pre id="output"></pre><div id="persist" class="meta"></div></div></div>`
};
function routeFromPath(){const p=location.pathname.replace(/^\/+|\/+$/g,'');return pages[p]?p:'home'}
function go(route,push=true){if(!pages[route])route='home';content.innerHTML=pages[route]();content.scrollTop=0;nav.forEach(b=>b.classList.toggle('active',b.dataset.route===route));const names={home:'TurtleBlock AI',about:'About — TurtleBlock AI',worldspec:'WorldSpec — TurtleBlock AI',charter:'Turtle Charter — TurtleBlock AI',research:'Research — TurtleBlock AI',build:'Build Log — TurtleBlock AI',steamhamlet:'STEAMHAMLET — TurtleBlock AI',reeducation:'RE/EDUCATION — TurtleBlock AI',privacy:'Privacy — TurtleBlock AI',try:'Try It — TurtleBlock AI'};document.title=names[route]||'TurtleBlock AI';if(push){const path=route==='home'?'/':`/${route}/`;if(location.pathname!==path)history.pushState({route},'',path)}bindPageActions();if(route==='try')bindTry()}
function bindPageActions(){document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)))}
nav.forEach(b=>b.addEventListener('click',e=>{e.preventDefault();go(b.dataset.route);if(matchMedia('(max-width:820px)').matches)setMenu(true)}));window.addEventListener('popstate',()=>go(routeFromPath(),false));
function setMenu(compact){navpanel.classList.toggle('compact',compact);panelhead.setAttribute('aria-expanded',String(!compact));menutoggle.textContent=compact?'Menu ▸':'Menu ▾'}function toggleMenu(){if(matchMedia('(max-width:820px)').matches)setMenu(!navpanel.classList.contains('compact'))}panelhead.addEventListener('click',toggleMenu);
function bindTry(){const idea=document.getElementById('idea'),consent=document.getElementById('consent'),submit=document.getElementById('submit'),result=document.getElementById('result'),output=document.getElementById('output'),persist=document.getElementById('persist');document.querySelectorAll('[data-example]').forEach(btn=>btn.addEventListener('click',()=>{idea.value=btn.dataset.example==='village'?villageIdea:riverIdea;idea.dispatchEvent(new Event('input'));idea.focus()}));function sessionId(){let id=localStorage.getItem('turtleblock_session');if(!id){id=crypto.randomUUID();localStorage.setItem('turtleblock_session',id)}return id}function sync(){submit.disabled=!consent.checked||idea.value.trim().length<3}consent.addEventListener('change',sync);idea.addEventListener('input',sync);submit.addEventListener('click',async()=>{submit.disabled=true;submit.textContent='Thinking with it…';result.classList.remove('hidden');output.textContent='';persist.textContent='';try{const r=await fetch('/api/worldspec/interpret',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({utterance:idea.value.trim(),anonymous_session_id:sessionId(),consent_version:'0.1',worldspec_version:'0.1'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');output.textContent=JSON.stringify(data.interpretation,null,2);persist.textContent=data.persistence?.stored?'Submission stored for research review.':'Interpretation worked; research persistence is not configured yet.'}catch(e){output.textContent='Error: '+e.message;output.className='error'}finally{submit.textContent='Build with Turtle';sync()}})}
go(routeFromPath(),false);
</script>
</body>
</html>
