<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TurtleBlock AI</title>
  <meta name="description" content="Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond." />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f0d; color: #eef7f0; }
    main { width: min(900px, calc(100% - 2rem)); padding: 4rem 1rem; }
    .mark { font-size: clamp(3rem, 12vw, 7rem); line-height: 1; }
    h1 { margin: 1rem 0 .5rem; font-size: clamp(2.5rem, 8vw, 5.5rem); letter-spacing: -.04em; }
    p { max-width: 720px; margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.6rem); line-height: 1.5; color: #b9c9bc; }
    .tag { margin-top: 2rem; display: inline-block; padding: .55rem .8rem; border: 1px solid #36513c; border-radius: 999px; color: #d8eadb; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🐢🧱</div>
    <h1>TurtleBlock AI</h1>
    <p>Constructivist AI agents for building, exploring, and iterating computational worlds in Minecraft and beyond.</p>
    <div class="tag">Building in public.</div>
  </main>
</body>
</html>
